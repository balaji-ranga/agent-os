<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ERP</title>
<style>body{font-family:system-ui,sans-serif;margin:2rem;color:#222}.m{opacity:.6;font-size:.9rem}.e{color:#a00}</style>
</head>
<body>
<p class="m" id="msg">Opening ERP company desk…</p>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var token = (p.get("t") || p.get("token") || "").trim();
  var forceLogout = p.get("logout") === "1";
  var forceWipe = forceLogout || p.get("wipe") === "1";
  var owner = (p.get("owner") || "").trim();
  var next = p.get("next") || "";
  if (next && (next.charAt(0) !== "/" || next.indexOf("//") === 0)) next = "";

  function setMsg(t, err) {
    var el = document.getElementById("msg");
    if (!el) return;
    el.textContent = t;
    el.className = err ? "e" : "m";
  }

  function wipe() {
    try {
      localStorage.clear();
      sessionStorage.clear();
    } catch (e) {}
    try {
      ["sid", "system_user", "full_name", "user_id", "user_image", "user_lang"].forEach(function (n) {
        document.cookie = n + "=; Max-Age=0; path=/";
        document.cookie = n + "=; Max-Age=0; path=/; Secure; SameSite=None";
      });
    } catch (e2) {}
  }

  if (forceWipe) wipe();
  if (forceLogout && !token) {
    setMsg("ERP session cleared.");
    return;
  }
  if (!token) {
    setMsg("Missing SSO token — open ERP from Flolah menu.", true);
    return;
  }

  // Same-origin cookie apply (nginx → backend /erp-sso-apply). Do NOT use document.cookie
  // or cross-origin JSON consume — Chrome blocks third-party iframe cookie writes.
  var apply =
    location.origin +
    "/flolah-erp-sso?t=" +
    encodeURIComponent(token) +
    (next ? "&next=" + encodeURIComponent(next) : "") +
    (owner ? "&owner=" + encodeURIComponent(owner) : "");
  setMsg("Signing into ERP…");
  location.replace(apply);
})();
</script>
</body>
</html>
