# HTTP-only nginx for local / dev testing (no TLS)
upstream agent_os_backend {
    server backend:3001;
}

upstream agent_os_frontend {
    server frontend:80;
}

# Omit query strings from /api access logs (internal_token / webhook secrets).
log_format agent_os_api '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri HTTP/$server_protocol" $status '
                        '$body_bytes_sent rt=$request_time';

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    location /api/ {
        access_log /var/log/nginx/api.access.log agent_os_api;
        proxy_pass http://agent_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    # OpenConnector console (admin cookie) — same BFF path as production nginx.conf
    location /openconnector/ {
        access_log /var/log/nginx/api.access.log agent_os_api;
        proxy_pass http://agent_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # OpenSearch Dashboards (admin cookie) — never expose :9200/:5601 on the host
    location /opensearch/ {
        access_log /var/log/nginx/api.access.log agent_os_api;
        proxy_pass http://agent_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://agent_os_backend/health;
        access_log off;
    }

    location = /docs {
        return 301 /docs/;
    }
    location ^~ /docs/ {
        root /usr/share/nginx/flolah-home;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /docs/index.html;
    }

    location / {
        proxy_pass http://agent_os_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
