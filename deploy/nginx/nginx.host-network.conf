upstream agent_os_backend {
    server 127.0.0.1:3001;
    keepalive 8;
}

upstream agent_os_frontend {
    server 127.0.0.1:8080;
    keepalive 4;
}

# Access logs omit query strings on /api so internal_token / webhook secrets never hit disk.
log_format agent_os_api '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri HTTP/$server_protocol" $status '
                        '$body_bytes_sent rt=$request_time '
                        '"$http_user_agent"';

log_format agent_os_default '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri HTTP/$server_protocol" $status '
                            '$body_bytes_sent rt=$request_time '
                            '"$http_referer" "$http_user_agent"';

# HTTP → HTTPS redirect (production)
server {
    listen 80;
    server_name flolah.cloud www.flolah.cloud;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name flolah.cloud www.flolah.cloud;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 32m;
    access_log /var/log/nginx/access.log agent_os_default;

    location /api/ {
        access_log /var/log/nginx/api.access.log agent_os_api;
        proxy_pass http://agent_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # OpenConnector console (admin cookie) + OAuth callbacks — proxied via backend BFF
    location /openconnector/ {
        access_log /var/log/nginx/api.access.log agent_os_api;
        proxy_pass http://agent_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # If the OC SPA escapes to site-root routes, bounce back under /openconnector
    location ~ ^/(overview|providers|actions|runs|access|resources)(/|$) {
        return 302 /openconnector$request_uri;
    }

    location /health {
        proxy_pass http://agent_os_backend/health;
        access_log off;
    }

    location / {
        proxy_pass http://agent_os_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
