upstream agent_os_backend {
    server 127.0.0.1:3001;
    keepalive 8;
}

upstream agent_os_frontend {
    server 127.0.0.1:8080;
    keepalive 4;
}

# Public MCP Universe abuse controls. The backend adds per-IP/session quotas and
# Turnstile; this edge bucket prevents request floods from reaching Node.
limit_req_zone $binary_remote_addr zone=mcp_universe_public:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=mcp_universe_connections:10m;

upstream agent_os_openclaw {
    server 127.0.0.1:18789;
    keepalive 4;
}

# Access logs omit query strings on /api so internal_token / webhook secrets never hit disk.
log_format agent_os_api '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri HTTP/$server_protocol" $status '
                        '$body_bytes_sent rt=$request_time '
                        '"$http_user_agent"';

log_format agent_os_default '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri HTTP/$server_protocol" $status '
                            '$body_bytes_sent rt=$request_time '
                            '"$http_referer" "$http_user_agent"';

# ---------------------------------------------------------------------------
# Apex marketing site — flolah.cloud + www.flolah.cloud (static homepage)
# CRM must NOT share these names. Twenty lives on crm.flolah.cloud only.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name flolah.cloud www.flolah.cloud;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flolah.cloud www.flolah.cloud;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 32m;
    access_log /var/log/nginx/access.log agent_os_default;

    root /usr/share/nginx/flolah-home;
    index index.html;

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    # Marketing subpages (must not fall through to the SPA proxy)
    location = /vision {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /vision.html =404;
    }
    location = /vision.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /vision.html =404;
    }

    # Legal pack (Terms, Privacy, Cookies, Open source, THIRD_PARTY_NOTICES.md) — not SPA
    location ^~ /legal/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { text/html html htm; text/css css; text/plain md txt; }
        default_type text/plain;
        try_files $uri $uri/ =404;
    }

    # Public Docusaurus user guide (open access; no auth)
    location = /docs {
        return 301 /docs/;
    }
    location ^~ /docs/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ^~ /docs/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /docs/index.html;
    }

    location = /blog {
        return 301 /blog/;
    }
    location ^~ /blog/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ^~ /blog/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /blog/index.html;
    }

    # Public Free Tools must stay on the marketing tree, not the app SPA.
    location = /free-tools {
        return 301 /free-tools/;
    }
    location ^~ /free-tools/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # Marketing assets first; unknown /assets/* fall through to the SPA build
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @apex_frontend;
    }

    location ^~ /api/public/mcp-universe/ {
        access_log /var/log/nginx/api.access.log agent_os_api;
        limit_req zone=mcp_universe_public burst=15 nodelay;
        limit_conn mcp_universe_connections 8;
        client_max_body_size 64k;
        proxy_pass http://agent_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        add_header Access-Control-Allow-Origin "https://flolah.cloud" always;
        add_header Vary "Origin" always;
    }

    location /api/ {
        access_log /var/log/nginx/api.access.log agent_os_api;
        proxy_pass http://agent_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /openconnector/ {
        access_log /var/log/nginx/api.access.log agent_os_api;
        proxy_pass http://agent_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /opensearch/ {
        access_log /var/log/nginx/api.access.log agent_os_api;
        proxy_pass http://agent_os_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location ~ ^/(overview|providers|actions|runs|access|resources)(/|$) {
        return 302 /openconnector$request_uri;
    }

    location /health {
        proxy_pass http://agent_os_backend/health;
        access_log off;
    }

    # OpenClaw Chrome extension relay (not the main gateway control WS).
    # The loopback relay rejects non-loopback Host headers (DNS-rebinding guard),
    # so we rewrite Host and path: /browser/extension → /extension on :18792.
    location /browser/extension {
        access_log /var/log/nginx/api.access.log agent_os_api;
        proxy_pass http://127.0.0.1:18792/extension;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:18792;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Prefer login.flolah.cloud for app deep links; keep SPA reachable on apex
    # until DNS + cert cover the login subdomain (see vps-expand-login-cert.sh).
    location / {
        proxy_pass http://agent_os_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @apex_frontend {
        proxy_pass http://agent_os_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

