        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# Business Core — Twenty CRM TLS proxy (iframe-safe HTTPS, same cert as login)
# Frontend embed: https://login.flolah.cloud:8443  (TWENTY_EMBED_URL)
# Upstream is host-bound compose port 127.0.0.1:3100 → twenty-server:3000
# ---------------------------------------------------------------------------
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name login.flolah.cloud;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 32m;
    access_log /var/log/nginx/access.log agent_os_default;

    # Allow Flolah SPA (login.flolah.cloud :443) to iframe Twenty
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    add_header Content-Security-Policy "frame-ancestors https://login.flolah.cloud https://flolah.cloud https://www.flolah.cloud 'self'" always;
    add_header X-Frame-Options "" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------
# Business Core — ERPNext TLS proxy (iframe-safe HTTPS)
#
# Preferred public origin (Hostinger/cloud often allow only :443, not :8444):
#   ERPNEXT_EMBED_URL=https://erp.crm.flolah.cloud
# (uses existing DNS wildcard *.crm.flolah.cloud — exact server_name wins over CRM *.crm)
# Also: https://erp.flolah.cloud once apex ERP A-record + cert SAN exist.
# Legacy :8444 kept for local/lab when the edge permits alternate ports.
# Upstream 127.0.0.1:8085 when optional-erpnext is up
# ---------------------------------------------------------------------------

# Exact host before CRM *.crm.flolah.cloud catch-all (nginx prefers exact match).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.crm.flolah.cloud erp.flolah.cloud;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 32m;
    access_log /var/log/nginx/access.log agent_os_default;

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    add_header Content-Security-Policy "frame-ancestors https://login.flolah.cloud https://flolah.cloud https://www.flolah.cloud 'self'" always;
    add_header X-Frame-Options "" always;

    location = /flolah-erp-handoff {
        return 301 /flolah-erp-handoff/$is_args$args;
    }
    location ^~ /flolah-erp-handoff/ {
        alias /usr/share/nginx/erp-handoff/;
        index index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    # Same-origin SSO: Set-Cookie (Secure; SameSite=None) + 302 Desk — works in Flolah iframe
    location = /flolah-erp-sso {
        proxy_pass http://127.0.0.1:3001/api/business-core/erp-sso-apply;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors https://login.flolah.cloud https://flolah.cloud https://www.flolah.cloud 'self'" always;
        add_header X-Frame-Options "" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        # Frappe site name from create-site (ERPNEXT_SITE_NAME), not request Host
        proxy_set_header Host frontend;
        proxy_set_header X-Frappe-Site-Name frontend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

