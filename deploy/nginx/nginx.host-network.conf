# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Twenty CRM — dedicated subdomain crm.flolah.cloud (host root SPA).
# Never bind CRM to flolah.cloud / www.flolah.cloud (marketing static).
# TWENTY_SERVER_URL / TWENTY_EMBED_URL = https://crm.flolah.cloud
# Needs DNS A/CNAME + cert SAN (bash deploy/scripts/vps-expand-crm-cert.sh).
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name crm.flolah.cloud *.crm.flolah.cloud;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Platform CRM apex (bootstrap / legacy). Multi-workspace UIs use {sub}.crm.flolah.cloud.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.flolah.cloud *.crm.flolah.cloud;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 32m;
    access_log /var/log/nginx/access.log agent_os_default;

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    add_header Content-Security-Policy "frame-ancestors https://login.flolah.cloud https://flolah.cloud https://www.flolah.cloud 'self'" always;
    add_header X-Frame-Options "" always;

    location = /flolah-handoff {
        return 301 /flolah-handoff/$is_args$args;
    }
    location ^~ /flolah-handoff/ {
        alias /usr/share/nginx/crm-handoff/;
        index index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        # Best-effort clear of common non-partitioned cookies (HttpOnly still
        # needs Twenty sign-out; localStorage wipe runs in the handoff page).
        add_header Set-Cookie "tokenPair=; Max-Age=0; Path=/; Secure; SameSite=Lax" always;
        add_header Set-Cookie "accessToken=; Max-Age=0; Path=/; Secure; SameSite=Lax" always;
        add_header Set-Cookie "refreshToken=; Max-Age=0; Path=/; Secure; SameSite=Lax" always;
    }

    # Same-origin CRM SSO apply: exchanged token pair into Twenty tokenPairState.
    # Do not proxy huge JWT Set-Cookie (502: upstream sent too big header).
    # Do not send the browser to Twenty /verify (Authentication failed → /welcome).
    location = /flolah-crm-sso {
        proxy_pass http://127.0.0.1:3001/api/business-core/crm-sso-apply;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        add_header Content-Security-Policy "frame-ancestors https://login.flolah.cloud https://flolah.cloud https://www.flolah.cloud 'self'" always;
        add_header X-Frame-Options "" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # Pass workspace subdomain host so Twenty multi-workspace can resolve origin
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# erp.flolah.cloud / erp.crm.flolah.cloud are defined in the ERPNext block above
# (exact names + Host: frontend). Do not reintroduce a host-as-site-name proxy.
