# Optional Business Core: Twenty CRM + ERPNext
# From deploy/:
#   docker compose -f docker-compose.yml -f docker-compose.business-core.yml --profile optional-twenty up -d
#   docker compose -f docker-compose.yml -f docker-compose.business-core.yml --profile optional-erpnext up -d
#
# Backend (same network) defaults:
#   TWENTY_API_URL=http://twenty-server:3000
#   ERPNEXT_URL=http://erpnext-frontend:8080
#
# See deploy/business-core/README.md

name: agent-os

services:
  twenty-db:
    profiles: ["optional-twenty"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TWENTY_DB_USER:-twenty}
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD:-twenty}
      POSTGRES_DB: ${TWENTY_DB_NAME:-twenty}
    volumes:
      - twenty_db_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TWENTY_DB_USER:-twenty} -d ${TWENTY_DB_NAME:-twenty}"]
      interval: 10s
      timeout: 5s
      retries: 10

  twenty-redis:
    profiles: ["optional-twenty"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    volumes:
      - twenty_redis_data:/data:Z

  twenty-server:
    profiles: ["optional-twenty"]
    image: ${TWENTY_SERVER_IMAGE:-twentycrm/twenty:latest}
    restart: unless-stopped
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_started
    environment:
      NODE_PORT: "3000"
      PG_DATABASE_URL: postgres://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD:-twenty}@twenty-db:5432/${TWENTY_DB_NAME:-twenty}
      SERVER_URL: ${TWENTY_SERVER_URL:-http://localhost:3100}
      # Workspace hosts {sub}.crm.* must call API same-origin (multi-workspace). Without this,
      # front pins REACT_APP_SERVER_BASE_URL to apex → CORS / "Unable to Reach Back-end".
      # CRM SSO applies in the Flolah iframe via /flolah-crm-sso (not Twenty /verify).
      FRONT_AUTO_BASE_URL: ${TWENTY_FRONT_AUTO_BASE_URL:-true}
      REDIS_URL: redis://twenty-redis:6379
      STORAGE_TYPE: local
      APP_SECRET: ${TWENTY_APP_SECRET:-change-me-twenty-app-secret-min-32-chars}
      IS_MULTIWORKSPACE_ENABLED: ${TWENTY_IS_MULTIWORKSPACE_ENABLED:-true}
      SIGN_IN_PREFILLED: ${TWENTY_SIGN_IN_PREFILLED:-false}
      # Optional Twenty enterprise (lifts the self-hosted 5-workspace cap). Empty = community cap.
      ENTERPRISE_KEY: ${TWENTY_ENTERPRISE_KEY:-}
      ENTERPRISE_VALIDITY_TOKEN: ${TWENTY_ENTERPRISE_VALIDITY_TOKEN:-}
    volumes:
      - twenty_data:/app/packages/twenty-server/.local-storage:Z
    ports:
      - "127.0.0.1:${TWENTY_HOST_PORT:-3100}:3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  twenty-worker:
    profiles: ["optional-twenty"]
    image: ${TWENTY_SERVER_IMAGE:-twentycrm/twenty:latest}
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    depends_on:
      twenty-server:
        condition: service_started
    environment:
      PG_DATABASE_URL: postgres://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD:-twenty}@twenty-db:5432/${TWENTY_DB_NAME:-twenty}
      SERVER_URL: ${TWENTY_SERVER_URL:-http://localhost:3100}
      FRONT_AUTO_BASE_URL: ${TWENTY_FRONT_AUTO_BASE_URL:-true}
      REDIS_URL: redis://twenty-redis:6379
      STORAGE_TYPE: local
      APP_SECRET: ${TWENTY_APP_SECRET:-change-me-twenty-app-secret-min-32-chars}
      IS_MULTIWORKSPACE_ENABLED: ${TWENTY_IS_MULTIWORKSPACE_ENABLED:-true}
      ENTERPRISE_KEY: ${TWENTY_ENTERPRISE_KEY:-}
      ENTERPRISE_VALIDITY_TOKEN: ${TWENTY_ENTERPRISE_VALIDITY_TOKEN:-}
    volumes:
      - twenty_data:/app/packages/twenty-server/.local-storage:Z

  # ---------------------------------------------------------------------------
  # ERPNext (Frappe) — multi-company site on MariaDB.
  # NOTE: ERPNext/Frappe requires MariaDB/MySQL. Twenty CRM uses twenty-db (Postgres).
  # Tenancy isolation mirrors CRM (1 Flolah company → 1 ERPNext Company) in Flolah SQLite
  # + User Permission filters; both stacks share the agent-os Docker network.
  # ---------------------------------------------------------------------------
  erpnext-db:
    profiles: ["optional-erpnext"]
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-admin}
    volumes:
      - erpnext_db_data:/var/lib/mysql:Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 30s

  erpnext-redis-cache:
    profiles: ["optional-erpnext"]
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - erpnext_redis_cache:/data:Z

  erpnext-redis-queue:
    profiles: ["optional-erpnext"]
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - erpnext_redis_queue:/data:Z

  erpnext-configurator:
    profiles: ["optional-erpnext"]
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v15.49.0}
    restart: "no"
    depends_on:
      erpnext-db:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_started
      erpnext-redis-queue:
        condition: service_started
    environment:
      DB_HOST: erpnext-db
      DB_PORT: "3306"
      REDIS_CACHE: redis://erpnext-redis-cache:6379
      REDIS_QUEUE: redis://erpnext-redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:Z
      - erpnext_logs:/home/frappe/frappe-bench/logs:Z
      - ./business-core/erpnext-configurator.sh:/scripts/erpnext-configurator.sh:ro
    entrypoint: ["bash", "/scripts/erpnext-configurator.sh"]

  erpnext-create-site:
    profiles: ["optional-erpnext"]
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v15.49.0}
    restart: "no"
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
      erpnext-db:
        condition: service_healthy
    environment:
      DB_HOST: erpnext-db
      ERPNEXT_SITE_NAME: ${ERPNEXT_SITE_NAME:-frontend}
      ERPNEXT_ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD:-admin}
      ERPNEXT_DB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-admin}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:Z
      - erpnext_logs:/home/frappe/frappe-bench/logs:Z
      - ./business-core/erpnext-create-site.sh:/scripts/erpnext-create-site.sh:ro
    entrypoint: ["bash", "/scripts/erpnext-create-site.sh"]

  # Gunicorn API + Desk backend (internal). Browser /assets must go via erpnext-frontend.
  erpnext-backend:
    profiles: ["optional-erpnext"]
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v15.49.0}
    restart: unless-stopped
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully
      erpnext-redis-cache:
        condition: service_started
      erpnext-redis-queue:
        condition: service_started
    environment:
      DB_HOST: erpnext-db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-admin}
      REDIS_CACHE: redis://erpnext-redis-cache:6379
      REDIS_QUEUE: redis://erpnext-redis-queue:6379
      REDIS_SOCKETIO: redis://erpnext-redis-queue:6379
      SOCKETIO_PORT: "9000"
      ERPNEXT_SITE_NAME: ${ERPNEXT_SITE_NAME:-frontend}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:Z
      - erpnext_logs:/home/frappe/frappe-bench/logs:Z
    command:
      - bash
      - -c
      - |
        set -e
        cd /home/frappe/frappe-bench
        SITE="$${ERPNEXT_SITE_NAME:-frontend}"
        echo "[erpnext-backend] starting gunicorn site=$$SITE"
        exec /home/frappe/frappe-bench/env/bin/gunicorn \
          --chdir=/home/frappe/frappe-bench/sites \
          --bind=0.0.0.0:8000 \
          --threads=4 \
          --workers=2 \
          --worker-class=gthread \
          --worker-tmp-dir=/dev/shm \
          --timeout=120 \
          --preload \
          frappe.app:application
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H \"Host: ${ERPNEXT_SITE_NAME:-frontend}\" http://127.0.0.1:8000/api/method/ping || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s

  # Official frappe nginx frontend: serves /assets/* and reverse-proxies API+websocket.
  # Host nginx (login TLS / erp.crm.*) proxies to 127.0.0.1:ERPNEXT_HOST_PORT → here, not bare gunicorn.
  erpnext-frontend:
    profiles: ["optional-erpnext"]
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v15.49.0}
    restart: unless-stopped
    depends_on:
      erpnext-backend:
        condition: service_healthy
      erpnext-websocket:
        condition: service_started
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_SITE_NAME:-frontend}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "on"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:Z
    command: ["nginx-entrypoint.sh"]
    ports:
      - "127.0.0.1:${ERPNEXT_HOST_PORT:-8085}:8080"
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -o /dev/null http://127.0.0.1:8080/assets/frappe/images/frappe-favicon.svg || curl -fsS -o /dev/null http://127.0.0.1:8080/api/method/ping || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 40s

  erpnext-websocket:
    profiles: ["optional-erpnext"]
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v15.49.0}
    restart: unless-stopped
    depends_on:
      erpnext-backend:
        condition: service_started
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:Z
      - erpnext_logs:/home/frappe/frappe-bench/logs:Z
    command:
      [
        "node",
        "/home/frappe/frappe-bench/apps/frappe/socketio.js",
      ]

  erpnext-queue-short:
    profiles: ["optional-erpnext"]
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v15.49.0}
    restart: unless-stopped
    depends_on:
      erpnext-backend:
        condition: service_started
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:Z
      - erpnext_logs:/home/frappe/frappe-bench/logs:Z
    command: ["bench", "worker", "--queue", "short,default"]

  erpnext-queue-long:
    profiles: ["optional-erpnext"]
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v15.49.0}
    restart: unless-stopped
    depends_on:
      erpnext-backend:
        condition: service_started
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:Z
      - erpnext_logs:/home/frappe/frappe-bench/logs:Z
    command: ["bench", "worker", "--queue", "long,default,short"]

  erpnext-scheduler:
    profiles: ["optional-erpnext"]
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v15.49.0}
    restart: unless-stopped
    depends_on:
      erpnext-backend:
        condition: service_started
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:Z
      - erpnext_logs:/home/frappe/frappe-bench/logs:Z
    command: ["bench", "schedule"]

volumes:
  twenty_db_data:
  twenty_redis_data:
  twenty_data:
  erpnext_db_data:
  erpnext_redis_cache:
  erpnext_redis_queue:
  erpnext_sites:
  erpnext_logs:
