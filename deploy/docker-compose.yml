  OPENCONNECTOR_URL: ${OPENCONNECTOR_URL:-}
  OPENCONNECTOR_MCP_URL: ${OPENCONNECTOR_MCP_URL:-}
  OPENCONNECTOR_MCP_ID: ${OPENCONNECTOR_MCP_ID:-mcp-openconnector}
  OPENCONNECTOR_MCP_BEARER: ${OPENCONNECTOR_MCP_BEARER:-}
  OPENCONNECTOR_MCP_TRANSPORT: ${OPENCONNECTOR_MCP_TRANSPORT:-streamable_http}
  OPENCONNECTOR_ADMIN_TOKEN: ${OPENCONNECTOR_ADMIN_TOKEN:-}
  OOMOL_CONNECT_ORIGIN: ${OOMOL_CONNECT_ORIGIN:-}
  OPENCONNECTOR_PUBLIC_ORIGIN: ${OPENCONNECTOR_PUBLIC_ORIGIN:-}
