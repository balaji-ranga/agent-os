# Agent OS production stack — Docker Compose / Podman Compose
#
# Quick start (from agent-os/deploy):
#   cp .env.example .env   # edit secrets + AGENT_OS_PUBLIC_URL
#   ./scripts/generate-dev-certs.sh   # or place real certs in nginx/certs/
#   docker compose --profile init run --rm init
#   docker compose up -d
#   # or: ./scripts/up.sh
#
# Deploy latest from laptop (no git pull on VPS):
#   .\deploy\scripts\sync-to-vps.ps1
# On VPS: bash scripts/vps-deploy-latest.sh
#
# Content tools baked into images + granted at backend boot:
#   email_send, notify_ceo, ceo_profile, Kanban/workflow tools (incl. agent_workflow_runs),
#   browser session: browse_* (browse_task_start, browse_recipe_list, browse_recipe_run, …)
#   OpenClaw: browser.enabled + browser-cdp agent (BROWSER_TASK_CDP_AGENT_ID); clear global tools.allow browser
#   (see scripts/lib/content-tools-allow.js BROWSER_SESSION_CONTENT_TOOLS + configure-openclaw-docker.js)
# Broadcast UI /api/broadcast: CEO-scoped OpenClaw sessions (tenant agent + session owner) so notify_ceo works
# Org tenancy docs: POST /api/agents/org/sync (My Org → Resync ORG.md & AGENTS.md)
# Notifications: shared NotificationProvider bell (shows datetime); dismiss via
#   /api/standups/notifications/dismiss* and /api/platform-notifications/read*
#   (user_feed_dismissals + composite standup+agent keys). Deploy verify smokes
#   self-clean so CEO Dashboard/bell are not polluted.
# CEO Policies (/policies): ceo_guardrails → POLICY.md in agent workspaces + Brain system-prompt prepend.
# AgentExchange / workflow A2A: /api/agent-exchange, /api/a2a/:publishId
#   New A2A agents default to deny_all IP until changed in AgentExchange UI.
#   VPS production: add docker-compose.vps-client-ip.yml (see deploy/README.md) so nginx
#   sees real client IPs for whitelist / deny_all enforcement.
# Workflow certify (Maker/Checker): WORKFLOW_CERTIFY_* in deploy/.env (LLM Checker default OFF).
#   Tools: agent_workflow_certify_start / _status / _resume (Workflow Builder).
#
# LLM keys: set in deploy/.env — injected at runtime into openclaw + backend containers.
# Never committed; never baked into images.
# Written to openclaw.json at init: gateway.auth.token, agent-os-content-tools.config.apiKey (from TOOLS_API_KEY).

name: agent-os

# Shared LLM/provider env — OpenClaw gateway reads these from process environment.
x-llm-env: &llm-env
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_PRIMARY_API_KEY: ${OPENAI_PRIMARY_API_KEY:-}
  OPENAI_PRIMARY_BASE_URL: ${OPENAI_PRIMARY_BASE_URL:-}
  OPENAI_PRIMARY_MODEL: ${OPENAI_PRIMARY_MODEL:-}
  OPENAI_SECONDARY_API_KEY: ${OPENAI_SECONDARY_API_KEY:-}
  OPENAI_SECONDARY_BASE_URL: ${OPENAI_SECONDARY_BASE_URL:-}
  OPENAI_SECONDARY_MODEL: ${OPENAI_SECONDARY_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
  OPENCLAW_MODEL_PRIMARY: ${OPENCLAW_MODEL_PRIMARY:-openai/gpt-4o-mini}
  OPENCLAW_OLLAMA_FALLBACK_MODEL: ${OPENCLAW_OLLAMA_FALLBACK_MODEL:-llama3.2}
  # When unset/0, configure-openclaw-docker.js clears agents.defaults.model.fallbacks
  OPENCLAW_ENABLE_OLLAMA_FALLBACK: ${OPENCLAW_ENABLE_OLLAMA_FALLBACK:-0}
  # Comma-separated OpenClaw model slugs tried after primary (e.g. ollama/llama3.2,openrouter/openai/gpt-4o-mini)
  OPENCLAW_MODEL_FALLBACKS: ${OPENCLAW_MODEL_FALLBACKS:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama-local}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
  # Soft fallback when CEO Profile OpenAI BYOK has no llm_model yet (Profile picker is primary)
  OPENAI_BYOK_MODEL: ${OPENAI_BYOK_MODEL:-gpt-4o-mini}
  # DeepSeek V3 via local Ollama (no cloud API key) — requires optional-ollama
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-http://ollama:11434/v1}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v3}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}

x-openclaw-env: &openclaw-env
  <<: *llm-env
  HOME: /root
  OPENCLAW_DIR: /root/.openclaw
  OPENCLAW_CONFIG_PATH: /root/.openclaw/openclaw.json
  PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
  OPENCLAW_GATEWAY_PORT: "18789"
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
  TOOLS_API_KEY: ${TOOLS_API_KEY:-}
  AGENT_OS_INTERNAL_API_URL: http://backend:3001
  BROWSER_TASK_CDP_AGENT_ID: ${BROWSER_TASK_CDP_AGENT_ID:-browser-cdp}
  # Applied by configure-openclaw-docker.js to agents.defaults + WhatsApp accounts
  OPENCLAW_MEDIA_MAX_MB: ${OPENCLAW_MEDIA_MAX_MB:-128}

x-backend-env: &backend-env
  <<: *llm-env
  PORT: "3001"
  NODE_ENV: production
  # Platform API access logs: off | error | info (default info)
  PLATFORM_LOG_LEVEL: ${PLATFORM_LOG_LEVEL:-info}
  HOME: /root
  OPENCLAW_DIR: /root/.openclaw
  OPENCLAW_CONFIG_PATH: /root/.openclaw/openclaw.json
  AGENT_OS_DATA_DIR: /data/agent-os
  AGENT_OS_BASE_URL: ${AGENT_OS_PUBLIC_URL}
  AGENT_OS_PUBLIC_URL: ${AGENT_OS_PUBLIC_URL}
  # Secured A2A access-token TTL (seconds); default in code is 3600 if unset
  A2A_ACCESS_TOKEN_TTL_SEC: ${A2A_ACCESS_TOKEN_TTL_SEC:-}
  A2A_SYNC_TIMEOUT_MS: ${A2A_SYNC_TIMEOUT_MS:-}
  A2A_ASYNC_WATCH_TIMEOUT_MS: ${A2A_ASYNC_WATCH_TIMEOUT_MS:-}
  A2A_CALLBACK_TIMEOUT_MS: ${A2A_CALLBACK_TIMEOUT_MS:-}
  LEARNINGS_FULL_REBUILD_DAYS: ${LEARNINGS_FULL_REBUILD_DAYS:-}
  ORDER_LEARNINGS_FULL_REBUILD_DAYS: ${ORDER_LEARNINGS_FULL_REBUILD_DAYS:-}
  BRAIN_HISTORY_FULL_REBUILD_DAYS: ${BRAIN_HISTORY_FULL_REBUILD_DAYS:-}
  OPENCLAW_GATEWAY_URL: http://openclaw:18789
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
  TOOLS_API_KEY: ${TOOLS_API_KEY:-}
  # In-container tool self-dispatch (must not use public HTTPS / self-signed URL)
  TOOLS_BASE_URL: ${TOOLS_BASE_URL:-http://127.0.0.1:3001}
  BROWSER_TASK_CDP_AGENT_ID: ${BROWSER_TASK_CDP_AGENT_ID:-browser-cdp}
  # Stable across restarts — required for workflow runner / tools / cron-callback auth
  AGENT_OS_INTERNAL_TOKEN: ${AGENT_OS_INTERNAL_TOKEN:-}
  OPENAI_COO_MODEL: ${OPENAI_COO_MODEL:-}
  OPENAI_INTENT_MODEL: ${OPENAI_INTENT_MODEL:-}
  OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
  OPENROUTER_SITE_TITLE: ${OPENROUTER_SITE_TITLE:-Agent OS}
  REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
  # Brave Search agent content tool (platform default Profile). Vault BRAVE_SEARCH_BYOK for BYOK Profiles.
  # Do NOT inject into brave-search-mcp service — that remains header BYOK only.
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  BRAVE_MCP_URL: ${BRAVE_MCP_URL:-http://brave-search-mcp:8080/mcp}
  # Market data (FMP) for monthly trading W1 screener / regime — paper mode falls back when 402
  MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-fmp}
  MARKET_DATA_BASE_URL: ${MARKET_DATA_BASE_URL:-}
  MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
  MARKET_DATA_SCREENER_UNIVERSE: ${MARKET_DATA_SCREENER_UNIVERSE:-}
  MARKET_DATA_CACHE_SCREENER_TTL_SEC_PAPER: ${MARKET_DATA_CACHE_SCREENER_TTL_SEC_PAPER:-}
  MARKET_DATA_CACHE_SCREENER_TTL_SEC_LIVE: ${MARKET_DATA_CACHE_SCREENER_TTL_SEC_LIVE:-}
  MARKET_DATA_CACHE_FUNDAMENTALS_TTL_SEC_PAPER: ${MARKET_DATA_CACHE_FUNDAMENTALS_TTL_SEC_PAPER:-}
  MARKET_DATA_CACHE_FUNDAMENTALS_TTL_SEC_LIVE: ${MARKET_DATA_CACHE_FUNDAMENTALS_TTL_SEC_LIVE:-}
  MARKET_DATA_CACHE_TODAY_BAR_TTL_SEC_PAPER: ${MARKET_DATA_CACHE_TODAY_BAR_TTL_SEC_PAPER:-}
  MARKET_DATA_CACHE_TODAY_BAR_TTL_SEC_LIVE: ${MARKET_DATA_CACHE_TODAY_BAR_TTL_SEC_LIVE:-}
  # Meta / Facebook OAuth app (Connectors → MCPs OAuth). Secrets stay on backend only.
  # Platform MCP seed: ensure-platform-mcps.sh → mcp-meta-graph (is_platform=1).
  FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
  FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
  META_GRAPH_MCP_URL: ${META_GRAPH_MCP_URL:-http://meta-graph-mcp:8081/mcp}
  MCP_OAUTH_CALLBACK_URL: ${MCP_OAUTH_CALLBACK_URL:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  HUNYUAN3D_URL: ${HUNYUAN3D_URL:-}
  HUNYUAN3D_TIMEOUT_MS: ${HUNYUAN3D_TIMEOUT_MS:-}
  SPEECH_STT_URL: ${SPEECH_STT_URL:-}
  SPEECH_TTS_URL: ${SPEECH_TTS_URL:-}
  # Business Core (optional Twenty / ERPNext — deploy/docker-compose.business-core.yml)
  TWENTY_API_URL: ${TWENTY_API_URL:-}
  TWENTY_API_KEY: ${TWENTY_API_KEY:-}
  TWENTY_SERVER_URL: ${TWENTY_SERVER_URL:-}
  TWENTY_EMBED_URL: ${TWENTY_EMBED_URL:-}
  TWENTY_PUBLIC_HTTPS_PORT: ${TWENTY_PUBLIC_HTTPS_PORT:-8443}
  TWENTY_APP_SECRET: ${TWENTY_APP_SECRET:-}
  TWENTY_DATABASE_URL: ${TWENTY_DATABASE_URL:-postgres://twenty:twenty@twenty-db:5432/twenty}
  TWENTY_SSO_ENABLED: ${TWENTY_SSO_ENABLED:-1}
  TWENTY_WORKSPACE_ID: ${TWENTY_WORKSPACE_ID:-}
  TWENTY_IS_MULTIWORKSPACE_ENABLED: ${TWENTY_IS_MULTIWORKSPACE_ENABLED:-true}
  TWENTY_FRONT_AUTO_BASE_URL: ${TWENTY_FRONT_AUTO_BASE_URL:-true}
  TWENTY_BOOTSTRAP_EMAIL: ${TWENTY_BOOTSTRAP_EMAIL:-}
  ERPNEXT_URL: ${ERPNEXT_URL:-}
  ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
  ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
  ERPNEXT_EMBED_URL: ${ERPNEXT_EMBED_URL:-}
  ERPNEXT_PUBLIC_URL: ${ERPNEXT_PUBLIC_URL:-}
  ERPNEXT_PUBLIC_HTTPS_PORT: ${ERPNEXT_PUBLIC_HTTPS_PORT:-8444}
  BUSINESS_CORE_MCP_URL: ${BUSINESS_CORE_MCP_URL:-http://business-core-mcp:8082/mcp}
  REPLICATE_PRIMARY_BASE_URL: ${REPLICATE_PRIMARY_BASE_URL:-https://api.replicate.com/v1}
  REPLICATE_SECONDARY_BASE_URL: ${REPLICATE_SECONDARY_BASE_URL:-}
  REPLICATE_SECONDARY_API_TOKEN: ${REPLICATE_SECONDARY_API_TOKEN:-}
  # Content tools: summarize / image / video
  TOOLS_SUMMARIZE_MODEL: ${TOOLS_SUMMARIZE_MODEL:-}
  TOOLS_SUMMARIZE_TIMEOUT_MS: ${TOOLS_SUMMARIZE_TIMEOUT_MS:-}
  TOOLS_SUMMARIZE_MAX_BYTES: ${TOOLS_SUMMARIZE_MAX_BYTES:-}
  TOOLS_SUMMARIZE_ALLOWED_DOMAINS: ${TOOLS_SUMMARIZE_ALLOWED_DOMAINS:-}
  TOOLS_IMAGE_MODEL: ${TOOLS_IMAGE_MODEL:-gpt-image-1}
  TOOLS_IMAGE_SIZE: ${TOOLS_IMAGE_SIZE:-1024x1024}
  TOOLS_IMAGE_QUALITY: ${TOOLS_IMAGE_QUALITY:-medium}
  TOOLS_IMAGE_STYLE: ${TOOLS_IMAGE_STYLE:-natural}
  TOOLS_IMAGE_MAX_PROMPT_CHARS: ${TOOLS_IMAGE_MAX_PROMPT_CHARS:-1000}
  TOOLS_IMAGE_SECONDARY_MODEL: ${TOOLS_IMAGE_SECONDARY_MODEL:-}
  TOOLS_VIDEO_MODEL_VERSION: ${TOOLS_VIDEO_MODEL_VERSION:-}
  TOOLS_VIDEO_MAX_PROMPT_CHARS: ${TOOLS_VIDEO_MAX_PROMPT_CHARS:-500}
  TOOLS_VIDEO_SECONDARY_MODEL_VERSION: ${TOOLS_VIDEO_SECONDARY_MODEL_VERSION:-}
  AGENT_OS_ADMIN_EMAIL: ${AGENT_OS_ADMIN_EMAIL:-admin@agent-os.local}
  AGENT_OS_ADMIN_PASSWORD: ${AGENT_OS_ADMIN_PASSWORD:-}
  # API Keys vault KEK (wraps optional per-key encryption phrases)
  USER_API_KEYS_KEK: ${USER_API_KEYS_KEK:-}
  OPENCLAW_DISCOVERY_TIMEOUT_MS: ${OPENCLAW_DISCOVERY_TIMEOUT_MS:-900000}
  OPENCLAW_FETCH_TIMEOUT_MS: ${OPENCLAW_FETCH_TIMEOUT_MS:-240000}
  # Cron schedules (optional overrides — defaults live in backend/src/index.js)
  STANDUP_SCHEDULE_CRON: ${STANDUP_SCHEDULE_CRON:-}
  STANDUP_CRON_SCHEDULE: ${STANDUP_CRON_SCHEDULE:-}
  DELEGATION_CRON_SCHEDULE: ${DELEGATION_CRON_SCHEDULE:-}
  DELEGATION_STATUS_ONLY_MAX_RETRIES: ${DELEGATION_STATUS_ONLY_MAX_RETRIES:-1}
  DELEGATION_GATEWAY_MAX_RETRIES: ${DELEGATION_GATEWAY_MAX_RETRIES:-8}
  STATUS_ONLY_REQUEUE_STARTUP_DELAY_MS: ${STATUS_ONLY_REQUEUE_STARTUP_DELAY_MS:-60000}
  AGENT_WORKFLOW_SCHEDULER_CRON: ${AGENT_WORKFLOW_SCHEDULER_CRON:-}
  JOB_PIPELINE_CRON_SCHEDULE: ${JOB_PIPELINE_CRON_SCHEDULE:-}
  COO_STATUS_CHECKER_CRON: ${COO_STATUS_CHECKER_CRON:-}
  DATA_RETENTION_CRON: ${DATA_RETENTION_CRON:-}
  KANBAN_ORPHAN_WATCHER_CRON: ${KANBAN_ORPHAN_WATCHER_CRON:-}
  SCHEDULED_GOALS_CRON: ${SCHEDULED_GOALS_CRON:-}
  # Timezone for cron expressions + chat day boundaries (default UTC)
  TZ: ${TZ:-UTC}
  # Timezone used to render dates for users (Kanban, task chat, reports); falls back to TZ
  PLATFORM_TIMEZONE: ${PLATFORM_TIMEZONE:-}
  # Optional Ollama context window for BYOK / local models
  OLLAMA_CONTEXT_WINDOW: ${OLLAMA_CONTEXT_WINDOW:-}
  OPENCLAW_OLLAMA_CHAT_TIMEOUT_MS: ${OPENCLAW_OLLAMA_CHAT_TIMEOUT_MS:-}
  CUSTOM_SCRIPT_MAX_BYTES: ${CUSTOM_SCRIPT_MAX_BYTES:-131072}
  CUSTOM_SCRIPT_TIMEOUT_MS: ${CUSTOM_SCRIPT_TIMEOUT_MS:-60000}
  CUSTOM_SCRIPT_PYTHON: ${CUSTOM_SCRIPT_PYTHON:-python3}
  CUSTOM_SCRIPT_NODE: ${CUSTOM_SCRIPT_NODE:-node}
  CUSTOM_SCRIPT_LLM_REVIEW: ${CUSTOM_SCRIPT_LLM_REVIEW:-1}
  CUSTOM_SCRIPT_LLM_REVIEW_REQUIRED: ${CUSTOM_SCRIPT_LLM_REVIEW_REQUIRED:-1}
  CUSTOM_SCRIPT_LLM_REVIEW_MAX_TOKENS: ${CUSTOM_SCRIPT_LLM_REVIEW_MAX_TOKENS:-768}
  # SMTP (workflow Send Email + email_send content tool + MFA email OTP)
  # notify_ceo is in-app only (platform_user_notifications) — no SMTP required
  WORKFLOW_SMTP_HOST: ${WORKFLOW_SMTP_HOST:-}
  WORKFLOW_SMTP_PORT: ${WORKFLOW_SMTP_PORT:-587}
  WORKFLOW_SMTP_SECURE: ${WORKFLOW_SMTP_SECURE:-0}
  WORKFLOW_SMTP_USER: ${WORKFLOW_SMTP_USER:-}
  WORKFLOW_SMTP_PASS: ${WORKFLOW_SMTP_PASS:-}
  WORKFLOW_SMTP_FROM: ${WORKFLOW_SMTP_FROM:-}
