# Agent OS production stack — Docker Compose / Podman Compose
#
# Quick start (from agent-os/deploy):
#   cp .env.example .env   # edit secrets + AGENT_OS_PUBLIC_URL
#   ./scripts/generate-dev-certs.sh   # or place real certs in nginx/certs/
#   docker compose --profile init run --rm init
#   docker compose up -d
#   # or: ./scripts/up.sh
#
# Deploy latest from laptop (no git pull on VPS):
#   .\deploy\scripts\sync-to-vps.ps1
# On VPS: bash scripts/vps-deploy-latest.sh
#
# Content tools baked into images + granted at backend boot:
#   email_send, notify_ceo, Kanban/workflow tools, browser (see scripts/lib/content-tools-allow.js)
# Broadcast UI /api/broadcast: CEO-scoped OpenClaw sessions (tenant agent + session owner) so notify_ceo works
# Org tenancy docs: POST /api/agents/org/sync (Dashboard Resync ORG.md & AGENTS.md)
# Notifications: shared NotificationProvider bell; dismiss via /api/standups/notifications/dismiss*
#   and /api/platform-notifications/read* (user_feed_dismissals + composite standup+agent keys)
# AgentExchange / workflow A2A: /api/agent-exchange, /api/a2a/:publishId
#
# LLM keys: set in deploy/.env — injected at runtime into openclaw + backend containers.
# Never committed; never baked into images.
# Written to openclaw.json at init: gateway.auth.token, agent-os-content-tools.config.apiKey (from TOOLS_API_KEY).

name: agent-os

# Shared LLM/provider env — OpenClaw gateway reads these from process environment.
x-llm-env: &llm-env
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_PRIMARY_API_KEY: ${OPENAI_PRIMARY_API_KEY:-}
  OPENAI_PRIMARY_BASE_URL: ${OPENAI_PRIMARY_BASE_URL:-}
  OPENAI_PRIMARY_MODEL: ${OPENAI_PRIMARY_MODEL:-}
  OPENAI_SECONDARY_API_KEY: ${OPENAI_SECONDARY_API_KEY:-}
  OPENAI_SECONDARY_BASE_URL: ${OPENAI_SECONDARY_BASE_URL:-}
  OPENAI_SECONDARY_MODEL: ${OPENAI_SECONDARY_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
  OPENCLAW_MODEL_PRIMARY: ${OPENCLAW_MODEL_PRIMARY:-openai/gpt-4o-mini}
  OPENCLAW_OLLAMA_FALLBACK_MODEL: ${OPENCLAW_OLLAMA_FALLBACK_MODEL:-llama3.2}
  # When unset/0, configure-openclaw-docker.js clears agents.defaults.model.fallbacks
  OPENCLAW_ENABLE_OLLAMA_FALLBACK: ${OPENCLAW_ENABLE_OLLAMA_FALLBACK:-0}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama-local}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
  # DeepSeek V3 via local Ollama (no cloud API key) — requires optional-ollama
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-http://ollama:11434/v1}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v3}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}

x-openclaw-env: &openclaw-env
  <<: *llm-env
  HOME: /root
  OPENCLAW_DIR: /root/.openclaw
  OPENCLAW_CONFIG_PATH: /root/.openclaw/openclaw.json
  PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
  OPENCLAW_GATEWAY_PORT: "18789"
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
  TOOLS_API_KEY: ${TOOLS_API_KEY:-}
  AGENT_OS_INTERNAL_API_URL: http://backend:3001

x-backend-env: &backend-env
  <<: *llm-env
  PORT: "3001"
  NODE_ENV: production
  HOME: /root
  OPENCLAW_DIR: /root/.openclaw
  OPENCLAW_CONFIG_PATH: /root/.openclaw/openclaw.json
  AGENT_OS_DATA_DIR: /data/agent-os
  AGENT_OS_BASE_URL: ${AGENT_OS_PUBLIC_URL}
  AGENT_OS_PUBLIC_URL: ${AGENT_OS_PUBLIC_URL}
  OPENCLAW_GATEWAY_URL: http://openclaw:18789
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
  TOOLS_API_KEY: ${TOOLS_API_KEY:-}
  # In-container tool self-dispatch (must not use public HTTPS / self-signed URL)
  TOOLS_BASE_URL: ${TOOLS_BASE_URL:-http://127.0.0.1:3001}
  # Stable across restarts — required for workflow runner / tools / cron-callback auth
  AGENT_OS_INTERNAL_TOKEN: ${AGENT_OS_INTERNAL_TOKEN:-}
  OPENAI_COO_MODEL: ${OPENAI_COO_MODEL:-}
  OPENAI_INTENT_MODEL: ${OPENAI_INTENT_MODEL:-}
  OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
  OPENROUTER_SITE_TITLE: ${OPENROUTER_SITE_TITLE:-Agent OS}
  REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
  REPLICATE_PRIMARY_BASE_URL: ${REPLICATE_PRIMARY_BASE_URL:-https://api.replicate.com/v1}
  REPLICATE_SECONDARY_BASE_URL: ${REPLICATE_SECONDARY_BASE_URL:-}
  REPLICATE_SECONDARY_API_TOKEN: ${REPLICATE_SECONDARY_API_TOKEN:-}
  # Content tools: summarize / image / video
  TOOLS_SUMMARIZE_MODEL: ${TOOLS_SUMMARIZE_MODEL:-}
  TOOLS_SUMMARIZE_TIMEOUT_MS: ${TOOLS_SUMMARIZE_TIMEOUT_MS:-}
  TOOLS_SUMMARIZE_MAX_BYTES: ${TOOLS_SUMMARIZE_MAX_BYTES:-}
  TOOLS_SUMMARIZE_ALLOWED_DOMAINS: ${TOOLS_SUMMARIZE_ALLOWED_DOMAINS:-}
  TOOLS_IMAGE_MODEL: ${TOOLS_IMAGE_MODEL:-gpt-image-1}
  TOOLS_IMAGE_SIZE: ${TOOLS_IMAGE_SIZE:-1024x1024}
  TOOLS_IMAGE_QUALITY: ${TOOLS_IMAGE_QUALITY:-medium}
  TOOLS_IMAGE_STYLE: ${TOOLS_IMAGE_STYLE:-natural}
  TOOLS_IMAGE_MAX_PROMPT_CHARS: ${TOOLS_IMAGE_MAX_PROMPT_CHARS:-1000}
  TOOLS_IMAGE_SECONDARY_MODEL: ${TOOLS_IMAGE_SECONDARY_MODEL:-}
  TOOLS_VIDEO_MODEL_VERSION: ${TOOLS_VIDEO_MODEL_VERSION:-}
  TOOLS_VIDEO_MAX_PROMPT_CHARS: ${TOOLS_VIDEO_MAX_PROMPT_CHARS:-500}
  TOOLS_VIDEO_SECONDARY_MODEL_VERSION: ${TOOLS_VIDEO_SECONDARY_MODEL_VERSION:-}
  AGENT_OS_ADMIN_EMAIL: ${AGENT_OS_ADMIN_EMAIL:-admin@agent-os.local}
  AGENT_OS_ADMIN_PASSWORD: ${AGENT_OS_ADMIN_PASSWORD:-}
  OPENCLAW_DISCOVERY_TIMEOUT_MS: ${OPENCLAW_DISCOVERY_TIMEOUT_MS:-900000}
  OPENCLAW_FETCH_TIMEOUT_MS: ${OPENCLAW_FETCH_TIMEOUT_MS:-240000}
  JOB_PIPELINE_CRON_SCHEDULE: ${JOB_PIPELINE_CRON_SCHEDULE:-}
  CUSTOM_SCRIPT_MAX_BYTES: ${CUSTOM_SCRIPT_MAX_BYTES:-131072}
  CUSTOM_SCRIPT_TIMEOUT_MS: ${CUSTOM_SCRIPT_TIMEOUT_MS:-60000}
  CUSTOM_SCRIPT_PYTHON: ${CUSTOM_SCRIPT_PYTHON:-python3}
  CUSTOM_SCRIPT_NODE: ${CUSTOM_SCRIPT_NODE:-node}
  CUSTOM_SCRIPT_LLM_REVIEW: ${CUSTOM_SCRIPT_LLM_REVIEW:-1}
  CUSTOM_SCRIPT_LLM_REVIEW_REQUIRED: ${CUSTOM_SCRIPT_LLM_REVIEW_REQUIRED:-1}
  CUSTOM_SCRIPT_LLM_REVIEW_MAX_TOKENS: ${CUSTOM_SCRIPT_LLM_REVIEW_MAX_TOKENS:-768}
  # SMTP (workflow Send Email + email_send content tool + MFA email OTP)
  # notify_ceo is in-app only (platform_user_notifications) — no SMTP required
  WORKFLOW_SMTP_HOST: ${WORKFLOW_SMTP_HOST:-}
  WORKFLOW_SMTP_PORT: ${WORKFLOW_SMTP_PORT:-587}
  WORKFLOW_SMTP_SECURE: ${WORKFLOW_SMTP_SECURE:-0}
  WORKFLOW_SMTP_USER: ${WORKFLOW_SMTP_USER:-}
  WORKFLOW_SMTP_PASS: ${WORKFLOW_SMTP_PASS:-}
  WORKFLOW_SMTP_FROM: ${WORKFLOW_SMTP_FROM:-}
  # Optional recipient for SMTP smoke scripts (test-email-send-tool.js, etc.)
  WORKFLOW_TEST_EMAIL_TO: ${WORKFLOW_TEST_EMAIL_TO:-}
  MFA_MODE: ${MFA_MODE:-}
  AGENT_OS_REQUIRE_MFA: ${AGENT_OS_REQUIRE_MFA:-}
  AGENT_OS_DISABLE_MFA: ${AGENT_OS_DISABLE_MFA:-}
  # Email inbound webhooks (SendGrid/Mailgun → /api/integrations/email-inbound/:id)
  EMAIL_INBOUND_WEBHOOK_SECRET: ${EMAIL_INBOUND_WEBHOOK_SECRET:-}
  # OpenConnector MCP (real gateway or optional-openconnector mock)
  OPENCONNECTOR_URL: ${OPENCONNECTOR_URL:-}
  OPENCONNECTOR_MCP_URL: ${OPENCONNECTOR_MCP_URL:-}
  OPENCONNECTOR_MCP_ID: ${OPENCONNECTOR_MCP_ID:-mcp-openconnector}
  OPENCONNECTOR_MCP_BEARER: ${OPENCONNECTOR_MCP_BEARER:-}
  OPENCONNECTOR_MCP_TRANSPORT: ${OPENCONNECTOR_MCP_TRANSPORT:-streamable_http}
  OPENCONNECTOR_ADMIN_TOKEN: ${OPENCONNECTOR_ADMIN_TOKEN:-}
  OOMOL_CONNECT_ORIGIN: ${OOMOL_CONNECT_ORIGIN:-}
  OPENCONNECTOR_PUBLIC_ORIGIN: ${OPENCONNECTOR_PUBLIC_ORIGIN:-}
  # Filesystem workflow nodes (persisted volume)
  WORKFLOW_FS_ROOTS: ${WORKFLOW_FS_ROOTS:-/data/workflow-fs}

services:
  openclaw:
    build:
      context: ..
      dockerfile: deploy/docker/openclaw.Dockerfile
    image: agent-os-openclaw:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *openclaw-env
      ENABLE_VNC: ${ENABLE_VNC:-0}
      # Official OpenAI: do NOT inject OPENAI_BASE_URL into the gateway.
      # A base URL forces openai-compat completions while plugin tools use type "custom",
      # which OpenAI rejects (400 invalid_request_error) and breaks all COO tool prompts.
      OPENAI_BASE_URL: ""
      OPENAI_PRIMARY_BASE_URL: ""
    volumes:
      - openclaw_home:/root/.openclaw:Z
    expose:
      - "18789"
    shm_size: "2gb"
    # Hardened default: no seccomp=unconfined / SYS_ADMIN.
    # For Chromium browser automation, start with:
    #   docker compose -f docker-compose.yml -f docker-compose.browser.yml up -d
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18789/ >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    image: agent-os-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - agent_os_data:/data/agent-os:Z
      - openclaw_home:/root/.openclaw:Z
      - workflow_fs:/data/workflow-fs:Z
    expose:
      - "3001"
    depends_on:
      openclaw:
        condition: service_started
      ollama:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: agent-os-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./nginx/certs:/etc/nginx/certs:ro,Z
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  init:
    profiles: ["init"]
    build:
      context: ..
      dockerfile: deploy/docker/openclaw.Dockerfile
    image: agent-os-openclaw:${IMAGE_TAG:-latest}
    environment:
      <<: *openclaw-env
      AGENT_OS_DATA_DIR: /data/agent-os
      OPENCLAW_SESSION_VISIBILITY: ${OPENCLAW_SESSION_VISIBILITY:-agent}
    volumes:
      - agent_os_data:/data/agent-os:Z
      - openclaw_home:/root/.openclaw:Z
    entrypoint: ["/entrypoint.sh", "bootstrap"]
    restart: "no"

  mcp-random-sse:
    profiles: ["optional-mcp"]
    build:
      context: ..
      dockerfile: deploy/docker/mcp-random-sse.Dockerfile
    image: agent-os-mcp-random-sse:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      MCP_RANDOM_PORT: "3099"
      MCP_AUTO_EMIT_MS: ${MCP_AUTO_EMIT_MS:-5000}
      WORKFLOW_HOOK_URL: ${WORKFLOW_HOOK_URL:-}
      WORKFLOW_HOOK_SECRET: ${WORKFLOW_HOOK_SECRET:-}
    expose:
      - "3099"

  # Real self-hosted OpenConnector runtime (admin UI should stay private; use a tunnel for v1 OAuth setup).
  openconnector:
    profiles: ["optional-openconnector"]
    image: ghcr.io/oomol-lab/open-connector:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      OOMOL_CONNECT_DATA_DIR: /app/data
      OOMOL_CONNECT_ADMIN_TOKEN: ${OPENCONNECTOR_ADMIN_TOKEN:-}
      OOMOL_CONNECT_ENCRYPTION_KEY: ${OPENCONNECTOR_ENCRYPTION_KEY:-}
      OOMOL_CONNECT_ORIGIN: ${OOMOL_CONNECT_ORIGIN:-}
      OOMOL_CONNECT_RUNTIME_TOKEN: ${OPENCONNECTOR_BOOTSTRAP_RUNTIME_TOKEN:-}
    volumes:
      - openconnector_data:/app/data:Z
    expose:
      - "3000"

  # Mock OpenConnector MCP for e2e / staging.
  openconnector-mcp-mock:
    profiles: ["optional-openconnector-mock"]
    build:
      context: ..
      dockerfile: deploy/docker/openconnector-mcp-mock.Dockerfile
    image: agent-os-openconnector-mcp-mock:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      OPENCONNECTOR_MOCK_PORT: "3105"
      OPENCONNECTOR_MOCK_TOKEN: ${OPENCONNECTOR_MOCK_TOKEN:-}
    expose:
      - "3105"

  # Local Ollama — hosts llama3.2, deepseek-v3, etc. (no cloud API keys).
  # Start: docker compose --profile optional-ollama up -d ollama
  # Pull DeepSeek V3: docker compose exec ollama ollama pull deepseek-v3
  ollama:
    profiles: ["optional-ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama:Z
    expose:
      - "11434"

  novnc:
    profiles: ["optional-browser-login"]
    image: ghcr.io/linuxserver/webtop:ubuntu-xfce
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
    ports:
      - "${NOVNC_PORT:-6080}:3000"
    volumes:
      - openclaw_home:/root/.openclaw:Z
    shm_size: "2gb"

volumes:
  agent_os_data:
  openclaw_home:
  workflow_fs:
  openconnector_data:
  ollama_data:
