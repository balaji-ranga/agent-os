  OPENCONNECTOR_MCP_ID: ${OPENCONNECTOR_MCP_ID:-mcp-openconnector}
  OPENCONNECTOR_MCP_BEARER: ${OPENCONNECTOR_MCP_BEARER:-}
  OPENCONNECTOR_MCP_TRANSPORT: ${OPENCONNECTOR_MCP_TRANSPORT:-streamable_http}
  OPENCONNECTOR_ADMIN_TOKEN: ${OPENCONNECTOR_ADMIN_TOKEN:-}
  OOMOL_CONNECT_ORIGIN: ${OOMOL_CONNECT_ORIGIN:-}
  OPENCONNECTOR_PUBLIC_ORIGIN: ${OPENCONNECTOR_PUBLIC_ORIGIN:-}
  # Mirror for status/UI; real gate is OOMOL_CONNECT_ALLOWED_CUSTOM_OAUTH on openconnector service
  OPENCONNECTOR_ALLOWED_CUSTOM_OAUTH: ${OPENCONNECTOR_ALLOWED_CUSTOM_OAUTH:-*}
  # Current OpenConnector persists per-connection OAuth clients. Enable only
  # for legacy images that require a global provider client during refresh.
  OPENCONNECTOR_LEGACY_GLOBAL_OAUTH_SEED: ${OPENCONNECTOR_LEGACY_GLOBAL_OAUTH_SEED:-0}
  OPENCONNECTOR_AUTH_RETRY_DELAYS_MS: ${OPENCONNECTOR_AUTH_RETRY_DELAYS_MS:-1000,5000,15000}
  # Shared per-connection pacing for hydrated Gmail reads (agents and workflows).
  GMAIL_READ_QUOTA_UNITS_PER_MINUTE: ${GMAIL_READ_QUOTA_UNITS_PER_MINUTE:-4000}
  CONNECTOR_OPERATION_TIMEOUT_MS: ${CONNECTOR_OPERATION_TIMEOUT_MS:-300000}
  OOMOL_CONNECT_ALLOWED_CUSTOM_OAUTH: ${OOMOL_CONNECT_ALLOWED_CUSTOM_OAUTH:-*}
  # OpenSearch (document meta + RAG; internal Docker network only — no host ports)
  OPENSEARCH_ENABLED: ${OPENSEARCH_ENABLED:-1}
  OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
  MCP_UNIVERSE_SYNC_CRON: ${MCP_UNIVERSE_SYNC_CRON:-}
  MCP_UNIVERSE_REGISTRY_URL: ${MCP_UNIVERSE_REGISTRY_URL:-https://registry.modelcontextprotocol.io/v0.1/servers}
  MCP_UNIVERSE_PAGE_SIZE: ${MCP_UNIVERSE_PAGE_SIZE:-100}
  MCP_UNIVERSE_MAX_PAGES: ${MCP_UNIVERSE_MAX_PAGES:-50}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-flolah.cloud,www.flolah.cloud}
  MCP_UNIVERSE_HUMAN_SESSION_SECRET: ${MCP_UNIVERSE_HUMAN_SESSION_SECRET:-}
  PROMOTION_WHATSAPP_CRON: ${PROMOTION_WHATSAPP_CRON:-}
  PROMOTION_TRACKING_SECRET: ${PROMOTION_TRACKING_SECRET:-}
  OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
  OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-}
  OPENSEARCH_DASHBOARDS_URL: ${OPENSEARCH_DASHBOARDS_URL:-http://opensearch-dashboards:5601}
  # Local Qwen embeddings (service `embeddings`, profile optional-embeddings) — not OpenAI cloud
  OPENSEARCH_EMBEDDING_BASE_URL: ${OPENSEARCH_EMBEDDING_BASE_URL:-http://embeddings:8080/v1}
  OPENSEARCH_EMBEDDING_MODEL: ${OPENSEARCH_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
  OPENSEARCH_EMBEDDING_DIMS: ${OPENSEARCH_EMBEDDING_DIMS:-1024}
  OPENSEARCH_EMBEDDING_API_KEY: ${OPENSEARCH_EMBEDDING_API_KEY:-local}
  OPENSEARCH_EMBEDDINGS_ENABLED: ${OPENSEARCH_EMBEDDINGS_ENABLED:-1}
  EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
  # Docker tool onboarding (Admin) — socket mounted on backend; fail-closed allow-list
  DOCKER_TOOLS_ENABLED: ${DOCKER_TOOLS_ENABLED:-0}
  DOCKER_TOOLS_SOCKET: ${DOCKER_TOOLS_SOCKET:-/var/run/docker.sock}
  DOCKER_TOOLS_NETWORK: ${DOCKER_TOOLS_NETWORK:-}
  DOCKER_TOOLS_REGISTRY_ALLOW: ${DOCKER_TOOLS_REGISTRY_ALLOW:-}
  DOCKER_TOOLS_REGISTRY_DENY: ${DOCKER_TOOLS_REGISTRY_DENY:-}
  DOCKER_TOOLS_MAX_MEMORY_MB: ${DOCKER_TOOLS_MAX_MEMORY_MB:-512}
  DOCKER_TOOLS_MAX_CPUS: ${DOCKER_TOOLS_MAX_CPUS:-1}
  DOCKER_TOOLS_STEPUP_TTL_MS: ${DOCKER_TOOLS_STEPUP_TTL_MS:-1800000}
  # Shared privileged OTP session (AgentSystem recovery, Docker tools, TLS). Default 30 min.
  ADMIN_PRIVILEGED_SESSION_TTL_MS: ${ADMIN_PRIVILEGED_SESSION_TTL_MS:-1800000}
  DOCKER_TOOLS_RESTART_OPENCLAW: ${DOCKER_TOOLS_RESTART_OPENCLAW:-1}
  # Filesystem workflow nodes (persisted volume)
  WORKFLOW_FS_ROOTS: ${WORKFLOW_FS_ROOTS:-/data/workflow-fs:/root/.openclaw/tenants:/root/.openclaw/media}
  # Autonomous workflow certify (Maker / Checker). LLM checker default OFF when unset/0.
  WORKFLOW_CERTIFY_MAX_ATTEMPTS: ${WORKFLOW_CERTIFY_MAX_ATTEMPTS:-5}
  WORKFLOW_CERTIFY_MAX_WALL_MS: ${WORKFLOW_CERTIFY_MAX_WALL_MS:-300000}
  WORKFLOW_CERTIFY_TEST_TIMEOUT_MS: ${WORKFLOW_CERTIFY_TEST_TIMEOUT_MS:-45000}
  WORKFLOW_CERTIFY_MAKER_MODEL: ${WORKFLOW_CERTIFY_MAKER_MODEL:-}
  WORKFLOW_CERTIFY_CHECKER_MODEL: ${WORKFLOW_CERTIFY_CHECKER_MODEL:-}
  WORKFLOW_CERTIFY_USE_LLM_CHECKER: ${WORKFLOW_CERTIFY_USE_LLM_CHECKER:-0}

services:
  openclaw:
    build:
      context: ..
      dockerfile: deploy/docker/openclaw.Dockerfile
    image: agent-os-openclaw:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *openclaw-env
      ENABLE_VNC: ${ENABLE_VNC:-0}
      # Official OpenAI: leave BASE_URL empty so configure-openclaw-docker.js uses Responses API
      # (a custom api.openai.com baseUrl breaks tool calls). For DeepSeek / other compatible
      # hosts, set OPENAI_BASE_URL / OPENAI_PRIMARY_BASE_URL in deploy/.env — they pass through.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_PRIMARY_BASE_URL: ${OPENAI_PRIMARY_BASE_URL:-}
    volumes:
      - openclaw_home:/root/.openclaw:Z
    # Loopback-only publish so host-network nginx can proxy:
    # - gateway :18789
    # - extension relay bridge :18792 → container 127.0.0.1:18799 (see openclaw-entrypoint)
    # Not reachable from the public internet.
    ports:
      - "127.0.0.1:18789:18789"
      - "127.0.0.1:18792:18792"
    shm_size: "2gb"
    # Hardened default: no seccomp=unconfined / SYS_ADMIN.
    # For Chromium browser automation, start with:
    #   docker compose -f docker-compose.yml -f docker-compose.browser.yml up -d
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18789/ >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Document meta + RAG search. Not published to the host — backend only.
  # Security plugin disabled; isolation is Docker network (same pattern as OpenClaw gateway).
  # License: Apache-2.0 — see repo THIRD_PARTY_NOTICES.md (OpenSearch NOTICE reproduced there).
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data:Z
    expose:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Admin Dashboards — only reachable via backend BFF at /opensearch/ (admin cookie).
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      SERVER_HOST: "0.0.0.0"
      SERVER_BASEPATH: /opensearch
      SERVER_REWRITEBASEPATH: "true"
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    expose:
      - "5601"
    depends_on:
      opensearch:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    image: agent-os-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - agent_os_data:/data/agent-os:Z
      - openclaw_home:/root/.openclaw:Z
      - workflow_fs:/data/workflow-fs:Z
      - custom_script_jobs:/custom-script-jobs:Z
    # Loopback-only publish (always). VPS host-network nginx proxies to 127.0.0.1:3001.
    # Keep this in base (not only vps-client-ip.yml) so a recreate without the overlay
    # cannot strip the port and 502 all logins while container healthcheck still passes.
    ports:
      - "127.0.0.1:3001:3001"
    expose:
      - "3001"
    depends_on:
      openclaw:
        condition: service_started
      opensearch:
        condition: service_healthy
      ollama:
        condition: service_started
        required: false
      embeddings:
        condition: service_healthy
        required: false
      custom-script-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  custom-script-runner:
    build:
      context: ..
      dockerfile: deploy/docker/custom-script-runner.Dockerfile
    image: agent-os-custom-script-runner:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      CUSTOM_SCRIPT_RUNNER_JOBS_DIR: /jobs
      CUSTOM_SCRIPT_MAX_BYTES: ${CUSTOM_SCRIPT_MAX_BYTES:-131072}
      CUSTOM_SCRIPT_TIMEOUT_MS: ${CUSTOM_SCRIPT_TIMEOUT_MS:-60000}
      CUSTOM_SCRIPT_MAX_CONCURRENT: ${CUSTOM_SCRIPT_MAX_CONCURRENT:-2}
    network_mode: none
    volumes:
      - custom_script_jobs:/jobs:Z
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').existsSync('/tmp/runner-ready')?0:1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: agent-os-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Loopback-only (always). Host-network nginx uses 127.0.0.1:8080 as SPA upstream.
    ports:
      - "127.0.0.1:8080:80"
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./nginx/certs:/etc/nginx/certs:ro,Z
      # Marketing homepage + public /docs/ (flolah.cloud) — SPA app lives on login.flolah.cloud
      - ./static/flolah-home:/usr/share/nginx/flolah-home:ro,Z
      - ./static/crm-handoff:/usr/share/nginx/crm-handoff:ro,Z
      - ./static/erp-handoff:/usr/share/nginx/erp-handoff:ro,Z
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  init:
    profiles: ["init"]
    build:
      context: ..
      dockerfile: deploy/docker/openclaw.Dockerfile
    image: agent-os-openclaw:${IMAGE_TAG:-latest}
    environment:
      <<: *openclaw-env
      AGENT_OS_DATA_DIR: /data/agent-os
      OPENCLAW_SESSION_VISIBILITY: ${OPENCLAW_SESSION_VISIBILITY:-agent}
    volumes:
      - agent_os_data:/data/agent-os:Z
      - openclaw_home:/root/.openclaw:Z
    entrypoint: ["/entrypoint.sh", "bootstrap"]
    restart: "no"

  mcp-random-sse:
    profiles: ["optional-mcp"]
    build:
      context: ..
      dockerfile: deploy/docker/mcp-random-sse.Dockerfile
    image: agent-os-mcp-random-sse:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      MCP_RANDOM_PORT: "3099"
      MCP_AUTO_EMIT_MS: ${MCP_AUTO_EMIT_MS:-5000}
      WORKFLOW_HOOK_URL: ${WORKFLOW_HOOK_URL:-}
      WORKFLOW_HOOK_SECRET: ${WORKFLOW_HOOK_SECRET:-}
    expose:
      - "3099"

  # Brave Search MCP (HTTP) — BYOK only. Pass X-Subscription-Token / Bearer from workflow MCP node.
  # Platform BRAVE_API_KEY is injected into *backend* (brave_web_search content tool), NOT this container.
  # Start: docker compose --profile optional-brave-mcp up -d --build brave-search-mcp
  brave-search-mcp:
    profiles: ["optional-brave-mcp"]
    build:
      context: ..
      dockerfile: deploy/docker/brave-search-mcp.Dockerfile
    image: agent-os-brave-search-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BRAVE_MCP_PORT: "8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Meta Graph MCP (HTTP) — Facebook Pages + Instagram. Token per request via Connectors MCP OAuth.
  # Start: docker compose --profile optional-meta-graph-mcp up -d --build meta-graph-mcp
  # Seed: docker compose exec backend node scripts/seed-meta-graph-mcp.js
  meta-graph-mcp:
    profiles: ["optional-meta-graph-mcp"]
    build:
      context: ..
      dockerfile: deploy/docker/meta-graph-mcp.Dockerfile
    image: agent-os-meta-graph-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      META_GRAPH_MCP_PORT: "8081"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Business Core MCP (HTTP) — Flolah CRM (Twenty) + ERP (ERPNext) tools for workflows / Brain.
  # Same tool surface as agent content tools (crm_*, erp_*). Owner via X-Ceo-User-Id (+ TOOLS_API_KEY inside container).
  # Start: docker compose --profile optional-business-core-mcp up -d --build business-core-mcp
  # Seed: docker compose exec backend node scripts/seed-business-core-mcp.js  # mcp-flolah-crm, mcp-flolah-erp
  business-core-mcp:
    profiles: ["optional-business-core-mcp"]
    build:
      context: ..
      dockerfile: deploy/docker/business-core-mcp.Dockerfile
    image: agent-os-business-core-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BUSINESS_CORE_MCP_PORT: "8082"
      AGENT_OS_TOOLS_URL: ${AGENT_OS_TOOLS_URL:-http://backend:3001}
      TOOLS_API_KEY: ${TOOLS_API_KEY:-}
    expose:
      - "8082"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Instaloader sidecar — self-hosted client. Still calls instagram.com (429 = Instagram, not SaaS Instaconnect).
  # Start: docker compose --profile optional-social-research-mcp up -d --build instaloader-sidecar
  instaloader-sidecar:
    profiles: ["optional-social-research-mcp"]
    build:
      context: ..
      dockerfile: deploy/docker/instaloader-sidecar.Dockerfile
    image: agent-os-instaloader-sidecar:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      INSTALOADER_PORT: "8083"
    expose:
      - "8083"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  # Social Research MCP (HTTP) — Places + Instaloader + indexed search + Meta Graph adapters.
  # Start: docker compose --profile optional-social-research-mcp up -d --build social-research-mcp
  # Seed: docker compose exec backend node scripts/seed-social-research-mcp.js
  social-research-mcp:
    profiles: ["optional-social-research-mcp"]
    build:
      context: ..
      dockerfile: deploy/docker/social-research-mcp.Dockerfile
    image: agent-os-social-research-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SOCIAL_RESEARCH_MCP_PORT: "8084"
      AGENT_OS_TOOLS_URL: ${AGENT_OS_TOOLS_URL:-http://backend:3001}
      TOOLS_API_KEY: ${TOOLS_API_KEY:-}
    expose:
      - "8084"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8084/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Web scrape MCP (HTTP) — Crawlee Cheerio + Playwright. Generic domain crawl + phrase filter.
  # Start: docker compose --profile optional-web-scrape-mcp up -d --build web-scrape-mcp
  # Seed: docker compose exec backend node scripts/seed-web-scrape-mcp.js
  web-scrape-mcp:
    profiles: ["optional-web-scrape-mcp"]
    build:
      context: ..
      dockerfile: deploy/docker/web-scrape-mcp.Dockerfile
    image: agent-os-web-scrape-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      WEB_SCRAPE_MCP_PORT: "8085"
      TOOLS_API_KEY: ${TOOLS_API_KEY:-}
      AGENT_OS_INTERNAL_TOKEN: ${AGENT_OS_INTERNAL_TOKEN:-}
      CRAWLEE_PURGE_ON_START: "1"
      WEB_SCRAPE_MAX_JOBS: ${WEB_SCRAPE_MAX_JOBS:-2}
    expose:
      - "8085"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8085/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 45s

  # tip = main builds (connection-scoped BYOA OAuth). Official :latest / v1.3.5 release ignores authorize clientId.
  # Open Connector: Apache-2.0 (OOMOL Lab). NOTICE + attribution: THIRD_PARTY_NOTICES.md / /legal/open-source.html
  openconnector:
    profiles: ["optional-openconnector"]
    image: ghcr.io/oomol-lab/open-connector:${OPENCONNECTOR_IMAGE_TAG:-tip}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      OOMOL_CONNECT_DATA_DIR: /app/data
      OOMOL_CONNECT_ADMIN_TOKEN: ${OPENCONNECTOR_ADMIN_TOKEN:-}
      OOMOL_CONNECT_ENCRYPTION_KEY: ${OPENCONNECTOR_ENCRYPTION_KEY:-}
      OOMOL_CONNECT_ORIGIN: ${OOMOL_CONNECT_ORIGIN:-}
      OOMOL_CONNECT_RUNTIME_TOKEN: ${OPENCONNECTOR_BOOTSTRAP_RUNTIME_TOKEN:-}
      # Connection-scoped BYOA OAuth (CEO App ID/secret on authorize + refresh). * or comma list e.g. github,linkedin,facebook
      OOMOL_CONNECT_ALLOWED_CUSTOM_OAUTH: ${OOMOL_CONNECT_ALLOWED_CUSTOM_OAUTH:-*}
    volumes:
      - openconnector_data:/app/data:Z
    expose:
      - "3000"

  # Mock OpenConnector MCP for e2e / staging.
  openconnector-mcp-mock:
    profiles: ["optional-openconnector-mock"]
    build:
      context: ..
      dockerfile: deploy/docker/openconnector-mcp-mock.Dockerfile
    image: agent-os-openconnector-mcp-mock:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      OPENCONNECTOR_MOCK_PORT: "3105"
      OPENCONNECTOR_MOCK_TOKEN: ${OPENCONNECTOR_MOCK_TOKEN:-}
    expose:
      - "3105"

  # Local Ollama — hosts llama3.2, deepseek-v3, etc. (no cloud API keys).
  # Start: docker compose --profile optional-ollama up -d ollama
  # Pull DeepSeek V3: docker compose exec ollama ollama pull deepseek-v3
  ollama:
    profiles: ["optional-ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Runtime KV. Catalog contextWindow stays OLLAMA_CONTEXT_WINDOW (65k precheck).
      # 8B@65k was SIGKILL'd on 16GB RAM (9.2GiB KV).
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_NUM_CTX:-32768}
      OLLAMA_FLASH_ATTENTION: "1"
      # q4_0/q8_0 cut KV RAM (needs flash-attn). CPU 16GB hosts: ensure-local sets q4_0.
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-}
    volumes:
      - ollama_data:/root/.ollama:Z
    expose:
      - "11434"

  # Internal model gateway. It fronts existing remote OpenAI/DeepSeek and local
  # Ollama deployments; no host port is published.
  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:main-latest}
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OPENAI_PRIMARY_BASE_URL: ${OPENAI_PRIMARY_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
      OPENAI_PRIMARY_API_KEY: ${OPENAI_PRIMARY_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_SECONDARY_BASE_URL: ${OPENAI_SECONDARY_BASE_URL:-https://api.openai.com/v1}
      OPENAI_SECONDARY_API_KEY: ${OPENAI_SECONDARY_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LITELLM_PRIMARY_MODEL_SPEC: ${LITELLM_PRIMARY_MODEL_SPEC:-openai/gpt-4o-mini}
      LITELLM_SECONDARY_MODEL_SPEC: ${LITELLM_SECONDARY_MODEL_SPEC:-openai/gpt-4o-mini}
      LITELLM_OLLAMA_MODEL_SPEC: ${LITELLM_OLLAMA_MODEL_SPEC:-ollama_chat/llama3.2}
      LITELLM_REASONING_MODEL_SPEC: ${LITELLM_REASONING_MODEL_SPEC:-ollama_chat/deepseek-r1:8b}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)\""]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 45s

  # Future vLLM CPU contract only. This profile is deliberately disabled in
  # production; Qwen hosting is deferred until a GPU/RAM-sized host exists.
  vllm:
    profiles: ["optional-vllm"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai-cpu:latest-x86_64}
    restart: unless-stopped
    cap_add: ["SYS_NICE"]
    security_opt: ["seccomp=unconfined"]
    shm_size: "4gb"
    environment:
      VLLM_CPU_KVCACHE_SPACE: ${VLLM_CPU_KVCACHE_SPACE:-2}
      HF_TOKEN: ${HF_TOKEN:-}
    command: ["${VLLM_MODEL:-facebook/opt-125m}", "--dtype", "float32", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"

  # Hunyuan3D 2.5 — optional GPU container for text/image → GLB avatars.
  # Requires NVIDIA Container Toolkit. Start:
  #   docker compose --profile optional-hunyuan3d up -d
  # Set HUNYUAN3D_URL=http://hunyuan3d:7860 on backend.
  hunyuan3d:
    profiles: ["optional-hunyuan3d"]
    image: ${HUNYUAN3D_IMAGE:-tencent/hunyuan3d:2.1}
    restart: unless-stopped
    # Override command if your image uses a different entrypoint:
    # command: ["python", "api_server.py", "--host", "0.0.0.0", "--port", "7860"]
    expose:
      - "7860"
    volumes:
      - hunyuan3d_data:/app/weights:Z
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all

  # Local Qwen embeddings for OpenSearch hybrid RAG (ensure-embeddings-env.sh).
  # Manual: docker compose --profile optional-embeddings up -d --build embeddings
  # Backend: OPENSEARCH_EMBEDDING_BASE_URL=http://embeddings:8080/v1 (no OpenAI keys).
  embeddings:
    profiles: ["optional-embeddings"]
    build:
      context: ..
      dockerfile: deploy/docker/qwen-embeddings.Dockerfile
    image: agent-os-qwen-embeddings:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Bound CPU consumption on shared VPS hosts; persists across recreates.
    cpus: ${EMBEDDING_CPU_LIMIT:-2.0}
    environment:
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_PORT: "8080"
      EMBEDDING_MAX_BATCH: ${EMBEDDING_MAX_BATCH:-8}
      HF_HOME: /data/embeddings
      TRANSFORMERS_CACHE: /data/embeddings/transformers
      SENTENCE_TRANSFORMERS_HOME: /data/embeddings/sentence-transformers
    volumes:
      - embeddings_data:/data/embeddings:Z
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  # Free local STT (faster-whisper) + TTS (Piper). Started automatically by
# deploy/scripts/ensure-voice-env.sh (up.sh / vps-deploy-latest.sh) unless SKIP_VOICE=1.
# Powers /api/speech/*, workflow speech_* nodes, and COO tools speech_tts / speech_stt.
# Manual: docker compose --profile optional-voice up -d --build whisper piper
# Then SPEECH_STT_URL=http://whisper:8000 and SPEECH_TTS_URL=http://piper:5500 on backend.
  whisper:
    profiles: ["optional-voice"]
    image: ${WHISPER_IMAGE:-fedirz/faster-whisper-server:latest-cpu}
    restart: unless-stopped
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-tiny.en}
      WHISPER__DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
    expose:
      - "8000"
    volumes:
      - whisper_data:/root/.cache:Z

  piper:
    profiles: ["optional-voice"]
    build:
      context: ..
      dockerfile: deploy/docker/piper-tts.Dockerfile
    image: agent-os-piper-tts:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      PIPER_PORT: "5500"
      PIPER_DATA_DIR: /data/piper
    expose:
      - "5500"
    volumes:
      - piper_data:/data/piper:Z

  novnc:
    profiles: ["optional-browser-login"]
    image: ghcr.io/linuxserver/webtop:ubuntu-xfce
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
    ports:
      - "${NOVNC_PORT:-6080}:3000"
    volumes:
      - openclaw_home:/root/.openclaw:Z
    shm_size: "2gb"

volumes:
  agent_os_data:
  openclaw_home:
  workflow_fs:
  openconnector_data:
  ollama_data:
  embeddings_data:
  hunyuan3d_data:
  whisper_data:
  piper_data:
  opensearch_data:
  custom_script_jobs:
