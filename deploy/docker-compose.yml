  DOCKER_TOOLS_REGISTRY_ALLOW: ${DOCKER_TOOLS_REGISTRY_ALLOW:-}
  DOCKER_TOOLS_REGISTRY_DENY: ${DOCKER_TOOLS_REGISTRY_DENY:-}
  DOCKER_TOOLS_MAX_MEMORY_MB: ${DOCKER_TOOLS_MAX_MEMORY_MB:-512}
  DOCKER_TOOLS_MAX_CPUS: ${DOCKER_TOOLS_MAX_CPUS:-1}
  DOCKER_TOOLS_STEPUP_TTL_MS: ${DOCKER_TOOLS_STEPUP_TTL_MS:-300000}
  DOCKER_TOOLS_RESTART_OPENCLAW: ${DOCKER_TOOLS_RESTART_OPENCLAW:-1}
  # Filesystem workflow nodes (persisted volume)
  WORKFLOW_FS_ROOTS: ${WORKFLOW_FS_ROOTS:-/data/workflow-fs:/root/.openclaw/tenants:/root/.openclaw/media}
  # Autonomous workflow certify (Maker / Checker). LLM checker default OFF when unset/0.
  WORKFLOW_CERTIFY_MAX_ATTEMPTS: ${WORKFLOW_CERTIFY_MAX_ATTEMPTS:-5}
  WORKFLOW_CERTIFY_MAX_WALL_MS: ${WORKFLOW_CERTIFY_MAX_WALL_MS:-300000}
  WORKFLOW_CERTIFY_TEST_TIMEOUT_MS: ${WORKFLOW_CERTIFY_TEST_TIMEOUT_MS:-45000}
  WORKFLOW_CERTIFY_MAKER_MODEL: ${WORKFLOW_CERTIFY_MAKER_MODEL:-}
  WORKFLOW_CERTIFY_CHECKER_MODEL: ${WORKFLOW_CERTIFY_CHECKER_MODEL:-}
  WORKFLOW_CERTIFY_USE_LLM_CHECKER: ${WORKFLOW_CERTIFY_USE_LLM_CHECKER:-0}

services:
  openclaw:
    build:
      context: ..
      dockerfile: deploy/docker/openclaw.Dockerfile
    image: agent-os-openclaw:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *openclaw-env
      ENABLE_VNC: ${ENABLE_VNC:-0}
      # Official OpenAI: leave BASE_URL empty so configure-openclaw-docker.js uses Responses API
      # (a custom api.openai.com baseUrl breaks tool calls). For DeepSeek / other compatible
      # hosts, set OPENAI_BASE_URL / OPENAI_PRIMARY_BASE_URL in deploy/.env — they pass through.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_PRIMARY_BASE_URL: ${OPENAI_PRIMARY_BASE_URL:-}
    volumes:
      - openclaw_home:/root/.openclaw:Z
    # Loopback-only publish so host-network nginx can proxy:
    # - gateway :18789
    # - extension relay bridge :18792 → container 127.0.0.1:18799 (see openclaw-entrypoint)
    # Not reachable from the public internet.
    ports:
      - "127.0.0.1:18789:18789"
      - "127.0.0.1:18792:18792"
    shm_size: "2gb"
    # Hardened default: no seccomp=unconfined / SYS_ADMIN.
    # For Chromium browser automation, start with:
    #   docker compose -f docker-compose.yml -f docker-compose.browser.yml up -d
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18789/ >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Document meta + RAG search. Not published to the host — backend only.
  # Security plugin disabled; isolation is Docker network (same pattern as OpenClaw gateway).
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data:Z
    expose:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Admin Dashboards — only reachable via backend BFF at /opensearch/ (admin cookie).
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      SERVER_HOST: "0.0.0.0"
      SERVER_BASEPATH: /opensearch
      SERVER_REWRITEBASEPATH: "true"
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    expose:
      - "5601"
    depends_on:
      opensearch:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    image: agent-os-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - agent_os_data:/data/agent-os:Z
      - openclaw_home:/root/.openclaw:Z
      - workflow_fs:/data/workflow-fs:Z
    expose:
      - "3001"
    depends_on:
      openclaw:
        condition: service_started
      opensearch:
        condition: service_healthy
      ollama:
        condition: service_started
        required: false
      embeddings:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: agent-os-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./nginx/certs:/etc/nginx/certs:ro,Z
      # Marketing homepage (flolah.cloud) — SPA app lives on login.flolah.cloud
      - ./static/flolah-home:/usr/share/nginx/flolah-home:ro,Z
      - ./static/crm-handoff:/usr/share/nginx/crm-handoff:ro,Z
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  init:
    profiles: ["init"]
    build:
      context: ..
      dockerfile: deploy/docker/openclaw.Dockerfile
    image: agent-os-openclaw:${IMAGE_TAG:-latest}
    environment:
      <<: *openclaw-env
      AGENT_OS_DATA_DIR: /data/agent-os
      OPENCLAW_SESSION_VISIBILITY: ${OPENCLAW_SESSION_VISIBILITY:-agent}
    volumes:
      - agent_os_data:/data/agent-os:Z
      - openclaw_home:/root/.openclaw:Z
    entrypoint: ["/entrypoint.sh", "bootstrap"]
    restart: "no"

  mcp-random-sse:
    profiles: ["optional-mcp"]
    build:
      context: ..
      dockerfile: deploy/docker/mcp-random-sse.Dockerfile
    image: agent-os-mcp-random-sse:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      MCP_RANDOM_PORT: "3099"
      MCP_AUTO_EMIT_MS: ${MCP_AUTO_EMIT_MS:-5000}
      WORKFLOW_HOOK_URL: ${WORKFLOW_HOOK_URL:-}
      WORKFLOW_HOOK_SECRET: ${WORKFLOW_HOOK_SECRET:-}
    expose:
      - "3099"

  # Brave Search MCP (HTTP) — BYOK only. Pass X-Subscription-Token / Bearer from workflow MCP node.
  # Platform BRAVE_API_KEY is injected into *backend* (brave_web_search content tool), NOT this container.
  # Start: docker compose --profile optional-brave-mcp up -d --build brave-search-mcp
  brave-search-mcp:
    profiles: ["optional-brave-mcp"]
    build:
      context: ..
      dockerfile: deploy/docker/brave-search-mcp.Dockerfile
    image: agent-os-brave-search-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BRAVE_MCP_PORT: "8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Meta Graph MCP (HTTP) — Facebook Pages + Instagram. Token per request via Connectors MCP OAuth.
  # Start: docker compose --profile optional-meta-graph-mcp up -d --build meta-graph-mcp
  # Seed: docker compose exec backend node scripts/seed-meta-graph-mcp.js
  meta-graph-mcp:
    profiles: ["optional-meta-graph-mcp"]
    build:
      context: ..
      dockerfile: deploy/docker/meta-graph-mcp.Dockerfile
    image: agent-os-meta-graph-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      META_GRAPH_MCP_PORT: "8081"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Business Core MCP (HTTP) — Flolah CRM (Twenty) + ERP (ERPNext) tools for workflows / Brain.
  # Same tool surface as agent content tools (crm_*, erp_*). Owner via X-Ceo-User-Id (+ TOOLS_API_KEY inside container).
  # Start: docker compose --profile optional-business-core-mcp up -d --build business-core-mcp
  # Seed: docker compose exec backend node scripts/seed-business-core-mcp.js  # mcp-flolah-crm, mcp-flolah-erp
  business-core-mcp:
    profiles: ["optional-business-core-mcp"]
    build:
      context: ..
      dockerfile: deploy/docker/business-core-mcp.Dockerfile
    image: agent-os-business-core-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BUSINESS_CORE_MCP_PORT: "8082"
      AGENT_OS_TOOLS_URL: ${AGENT_OS_TOOLS_URL:-http://backend:3001}
      TOOLS_API_KEY: ${TOOLS_API_KEY:-}
    expose:
      - "8082"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Real self-hosted OpenConnector runtime (admin UI should stay private; use a tunnel for v1 OAuth setup).
  openconnector:
    profiles: ["optional-openconnector"]
    image: ghcr.io/oomol-lab/open-connector:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      OOMOL_CONNECT_DATA_DIR: /app/data
      OOMOL_CONNECT_ADMIN_TOKEN: ${OPENCONNECTOR_ADMIN_TOKEN:-}
      OOMOL_CONNECT_ENCRYPTION_KEY: ${OPENCONNECTOR_ENCRYPTION_KEY:-}
      OOMOL_CONNECT_ORIGIN: ${OOMOL_CONNECT_ORIGIN:-}
      OOMOL_CONNECT_RUNTIME_TOKEN: ${OPENCONNECTOR_BOOTSTRAP_RUNTIME_TOKEN:-}
    volumes:
      - openconnector_data:/app/data:Z
    expose:
      - "3000"

  # Mock OpenConnector MCP for e2e / staging.
  openconnector-mcp-mock:
    profiles: ["optional-openconnector-mock"]
    build:
      context: ..
      dockerfile: deploy/docker/openconnector-mcp-mock.Dockerfile
    image: agent-os-openconnector-mcp-mock:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      OPENCONNECTOR_MOCK_PORT: "3105"
      OPENCONNECTOR_MOCK_TOKEN: ${OPENCONNECTOR_MOCK_TOKEN:-}
    expose:
      - "3105"

  # Local Ollama — hosts llama3.2, deepseek-v3, etc. (no cloud API keys).
  # Start: docker compose --profile optional-ollama up -d ollama
  # Pull DeepSeek V3: docker compose exec ollama ollama pull deepseek-v3
  ollama:
    profiles: ["optional-ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama:Z
    expose:
      - "11434"

  # Hunyuan3D 2.5 — optional GPU container for text/image → GLB avatars.
  # Requires NVIDIA Container Toolkit. Start:
  #   docker compose --profile optional-hunyuan3d up -d
  # Set HUNYUAN3D_URL=http://hunyuan3d:7860 on backend.
  hunyuan3d:
    profiles: ["optional-hunyuan3d"]
    image: ${HUNYUAN3D_IMAGE:-tencent/hunyuan3d:2.1}
    restart: unless-stopped
    # Override command if your image uses a different entrypoint:
    # command: ["python", "api_server.py", "--host", "0.0.0.0", "--port", "7860"]
    expose:
      - "7860"
    volumes:
      - hunyuan3d_data:/app/weights:Z
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all

  # Local Qwen embeddings for OpenSearch hybrid RAG (ensure-embeddings-env.sh).
  # Manual: docker compose --profile optional-embeddings up -d --build embeddings
  # Backend: OPENSEARCH_EMBEDDING_BASE_URL=http://embeddings:8080/v1 (no OpenAI keys).
  embeddings:
    profiles: ["optional-embeddings"]
    build:
      context: ..
      dockerfile: deploy/docker/qwen-embeddings.Dockerfile
    image: agent-os-qwen-embeddings:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_PORT: "8080"
      EMBEDDING_MAX_BATCH: ${EMBEDDING_MAX_BATCH:-8}
      HF_HOME: /data/embeddings
      TRANSFORMERS_CACHE: /data/embeddings/transformers
      SENTENCE_TRANSFORMERS_HOME: /data/embeddings/sentence-transformers
    volumes:
      - embeddings_data:/data/embeddings:Z
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  # Free local STT (faster-whisper) + TTS (Piper). Started automatically by
# deploy/scripts/ensure-voice-env.sh (up.sh / vps-deploy-latest.sh) unless SKIP_VOICE=1.
# Powers /api/speech/*, workflow speech_* nodes, and COO tools speech_tts / speech_stt.
# Manual: docker compose --profile optional-voice up -d --build whisper piper
# Then SPEECH_STT_URL=http://whisper:8000 and SPEECH_TTS_URL=http://piper:5500 on backend.
  whisper:
    profiles: ["optional-voice"]
    image: ${WHISPER_IMAGE:-fedirz/faster-whisper-server:latest-cpu}
    restart: unless-stopped
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-tiny.en}
      WHISPER__DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
    expose:
      - "8000"
    volumes:
      - whisper_data:/root/.cache:Z

  piper:
    profiles: ["optional-voice"]
    build:
      context: ..
      dockerfile: deploy/docker/piper-tts.Dockerfile
    image: agent-os-piper-tts:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      PIPER_PORT: "5500"
      PIPER_DATA_DIR: /data/piper
    expose:
      - "5500"
    volumes:
      - piper_data:/data/piper:Z

  novnc:
    profiles: ["optional-browser-login"]
    image: ghcr.io/linuxserver/webtop:ubuntu-xfce
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
    ports:
      - "${NOVNC_PORT:-6080}:3000"
    volumes:
      - openclaw_home:/root/.openclaw:Z
    shm_size: "2gb"

volumes:
  agent_os_data:
  openclaw_home:
  workflow_fs:
  openconnector_data:
  ollama_data:
  embeddings_data:
  hunyuan3d_data:
  whisper_data:
  piper_data:
  opensearch_data:
