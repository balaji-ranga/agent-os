# VPS-only networking override (required on production; part of COMPOSE_FILE default).
#
# Docker's userland port proxy masks external client IPs as the bridge gateway.
# Run nginx in host networking with nginx.host-network.conf so nginx sees the real
# remote address for A2A deny_all / whitelist IP policy, desktop package, browser
# worker, and IBKR local-bridge-webhook IP checks.
#
# Loopback ports for backend/frontend also live in base docker-compose.yml so a
# backend-only recreate without this file cannot drop 127.0.0.1:3001 (login 502).
# Re-declare them here so an older image of this overlay still documents topology.
services:
  backend:
    ports:
      - "127.0.0.1:3001:3001"

  frontend:
    ports:
      - "127.0.0.1:8080:80"

  nginx:
    network_mode: host
    ports: !reset []
    volumes:
      - ./nginx/nginx.host-network.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./nginx/certs:/etc/nginx/certs:ro,Z
      - ./static/flolah-home:/usr/share/nginx/flolah-home:ro,Z
      - ./static/crm-handoff:/usr/share/nginx/crm-handoff:ro,Z
      - ./static/erp-handoff:/usr/share/nginx/erp-handoff:ro,Z
