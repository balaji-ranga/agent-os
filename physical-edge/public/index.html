<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flolah local physical simulator</title>
<style>body{font:15px/1.5 system-ui;max-width:1100px;margin:30px auto;padding:0 20px;color:#17233c;background:#f6f8fb}article{border:1px solid #cbd6e5;background:white;border-radius:10px;padding:18px;margin:15px 0}input,select,button{font:inherit;padding:9px;margin:5px;border-radius:6px;border:1px solid #aab8ce}button{cursor:pointer;background:#e6eefc}pre{white-space:pre-wrap;overflow-wrap:anywhere}#error{color:#9d2121}</style>
<h1>Local physical device simulator</h1><p>Software-only switch, sensor and robot profiles. No hardware compatibility or equipment safety is certified by these tests.</p><label>Local control token <input id="token" type="password" autocomplete="off"></label><button id="refresh">Connect / refresh</button><p id="error" role="alert"></p><div id="devices"></div><h2>Gateway status and journal</h2><pre id="gateway"></pre>
<script>
const $=id=>document.getElementById(id);function node(tag,text,parent){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;parent?.append(e);return e;}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
async function safe(fn){try{$('error').textContent='';await fn();}catch(e){$('error').textContent=e.message;}}
async function refresh(){const state=await api('/status');$('gateway').textContent=JSON.stringify(state.gateway,null,2);$('devices').replaceChildren();
for(const [deviceId,d]of Object.entries(state.simulator?.devices||{})){const card=node('article',undefined,$('devices'));node('h2',deviceId+' · SIMULATED '+d.description.flolah.profile,card);node('pre',JSON.stringify(d.values,null,2),card);
const label=node('label','Fault mode ',card),mode=node('select',undefined,label);mode.setAttribute('aria-label',deviceId+' fault mode');for(const value of ['normal','offline','accepted_only','lost_ack','stale','fail']){const option=node('option',value,mode);option.value=value;}mode.value=d.mode;
const delayLabel=node('label','Delay (ms) ',card),delay=node('input',undefined,delayLabel);delay.type='number';delay.value=d.delayMs;
let temp;if(d.description.flolah.profile==='sensor'){const l=node('label','Temperature ',card);temp=node('input',undefined,l);temp.type='number';temp.value=d.values.temperature;}
const save=node('button','Apply simulation settings',card);save.onclick=()=>safe(async()=>{await api('/simulator/control',{deviceId,mode:mode.value,delayMs:Number(delay.value),...(temp?{temperature:Number(temp.value)}:{})});await refresh();});
const offline=node('button','Run pre-approved offline routine',card);offline.onclick=()=>safe(async()=>{await api('/offline',{deviceId});await refresh();});}}
$('refresh').onclick=()=>safe(refresh);
</script></html>
