# Fail the PR / push if committed company blueprints still contain live keys.
# Publish/export of a live CEO company is the leak path — this gate keeps that off GitHub.
name: Blueprint secret scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit — sanitizer strips OpenAI / Brevo / SMTP
        run: node backend/scripts/test-blueprint-secret-sanitize.js
      - name: Scan packs, standard graphs, and export zips
        run: node backend/scripts/scan-blueprint-secrets.js
      - name: Scan public docs for credentials and private deployment details
        run: node backend/scripts/scan-public-docs-sensitive.js
