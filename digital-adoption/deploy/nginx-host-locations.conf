# Add only inside the existing login HTTPS server. Test nginx before reload.
location ^~ /free-tools/digital-adoption/ {
    proxy_pass http://127.0.0.1:4193/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 210s;
    client_max_body_size 23m;
    proxy_request_buffering off;
    client_body_timeout 15s;
    # Public adoption assets only; application/json API bodies stay uncompressed.
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/javascript application/javascript text/css;
    access_log off;
}
# The two named zones must be included once in nginx's http context.
location = /free-tools/digital-adoption/v1/tasks/upload {
    limit_req zone=adoption_task_uploads burst=10 nodelay;
    limit_req_status 429;
    limit_conn adoption_task_upload_connections 4;
    limit_conn_status 429;
    error_page 429 = @adoption_upload_limited;
    client_max_body_size 23m;
    client_body_timeout 15s;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://127.0.0.1:4193/v1/tasks/upload;
}
location @adoption_upload_limited {
    default_type application/json;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Expose-Headers Retry-After always;
    add_header Vary Origin always;
    add_header Retry-After 5 always;
    add_header Cache-Control no-store always;
    return 429 '{"error":"Upload capacity reached; retry later","code":"UPLOAD_RATE_LIMIT"}';
}
location = /internal/digital-adoption-model {
    proxy_pass http://127.0.0.1:4195/complete;
    proxy_read_timeout 195s;
    # Maximum configured model context (128000) plus transport overhead (4096).
    # Gateway admission still enforces the actual deployment setting.
    client_max_body_size 132096;
    access_log off;
}
