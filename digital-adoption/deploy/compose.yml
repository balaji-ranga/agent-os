services:
  adoption:
    image: flolah-digital-adoption:${ADOPTION_RELEASE:?release required}
    restart: unless-stopped
    ports: ["127.0.0.1:4193:4193"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1024m
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    volumes:
      - ${ADOPTION_ROOT:?}/config/service.json:/config/service.json:ro
      - ${ADOPTION_ROOT:?}/data:/data
    networks: [platform, workers]
  adoption-worker:
    image: flolah-digital-adoption:${ADOPTION_RELEASE:?release required}
    command: [node, src/worker-runtime.mjs]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${ADOPTION_WORKER_MEMORY:-1024m}
    cpus: ${ADOPTION_WORKER_CPUS:-1}
    pids_limit: 64
    stop_grace_period: 35s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    tmpfs: ["/tmp:size=128m,noexec,nosuid,mode=1777"]
    volumes:
      - ${ADOPTION_ROOT:?}/config/worker.json:/config/worker.json:ro
    networks: [workers]
  adoption-model-gateway:
    image: flolah-digital-adoption:${ADOPTION_RELEASE:?release required}
    command: [node, integrations/model-gateway-server.mjs]
    restart: unless-stopped
    ports: ["127.0.0.1:4195:4195"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    volumes:
      - ${ADOPTION_ROOT:?}/config/gateway.json:/config/gateway.json:ro
      - platform-data:/platform:ro
    networks: [platform]
networks:
  workers:
    internal: true
  platform:
    external: true
    name: agent-os_default
volumes:
  platform-data:
    external: true
    name: agent-os_agent_os_data
