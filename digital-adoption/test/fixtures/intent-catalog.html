<!doctype html><html lang="en"><meta charset="utf-8"><title>Workshop directory</title><style>body{font:16px system-ui;padding:32px}label{display:block;margin:12px}button,input{font:inherit;padding:8px}article{padding:10px;border:1px solid #ccd;margin:8px}section{max-width:700px}</style>
<main><h1>Workshop directory</h1><label>Find workshops<input id="query"></label><button id="apply" type="button">Apply query</button><p role="status" id="summary">3 workshops</p><section id="results"></section><form id="registration"><h2>Workshop registration</h2><label>Registration name<input name="registration_name" required></label><button type="submit">Register</button></form><p id="registration-status" role="status"></p></main>
<script>window.searchRuns=0;window.registrations=0;const workshops=['Robotics workshop','Finance conference','Design practice'];function render(){const q=document.querySelector('#query').value.toLowerCase().split(/\s+/).filter(Boolean),items=workshops.filter(name=>!q.length||q.some(term=>name.toLowerCase().includes(term)));document.querySelector('#results').innerHTML=items.map(x=>'<article><h2>'+x+'</h2></article>').join('');document.querySelector('#summary').textContent=items.length+' workshops';}document.querySelector('#apply').onclick=()=>{searchRuns++;render()};document.querySelector('#registration').onsubmit=e=>{e.preventDefault();registrations++;document.querySelector('#registration-status').textContent='Submitted registration successfully';};render();</script>
<script type="module">const config=await(await fetch('/demo-config.json')).json();const{mount}=await import(config.serviceUrl+'sdk.mjs');await mount(config);</script></html>
